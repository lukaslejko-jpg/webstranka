;gap:18px}.card{cursor:pointer;position:relative;transition:transform .15s ease,opacity .15s}.card:active{transform:scale(.985)}.heart{position:absolute;right:9px;top:9px;width:36px;height:36px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:20px;z-index:2}.heart.on{background:#fff;color:#111}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#222}.ct{font-size:16px;font-weight:800;margin-top:8px;line-height:1.25}.ca{color:#aaa;font-size:13px;margin-top:4px}.thumbWrap{position:relative}.dur{position:absolute;right:7px;bottom:7px;background:#000c;color:#fff;padding:3px 6px;border-radius:5px;font-size:12px;font-weight:800}.timeRow{display:flex;justify-content:space-between;color:#aaa;font-size:13px;margin-top:-12px;margin-bottom:12px}.player{border-left:1px solid #2a2a2a;background:linear-gradient(180deg,#181818,#111);padding:18px;display:flex;flex-direction:column;min-width:0;overflow:auto}.playerTools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}.playerTools button{border:1px solid #444;background:#222;color:#fff;border-radius:16px;padding:7px 11px;font-weight:800}.video{aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px #0008}.player{box-shadow:inset 20px 0 50px #0003}.card .thumb{box-shadow:0 8px 22px #0005}.video iframe{width:100%;height:100%}.now{font-size:20px;font-weight:800;margin-top:15px}.artist{color:#aaa;margin-top:5px}.seek{width:100%;margin:18px 0}.controls{display:flex;justify-content:center;align-items:center;gap:14px}.ctl{width:58px;height:58px;border:1px solid #555;border-radius:50%;font-size:0;font-weight:800;background:#202020;color:#fff;display:flex;align-items:center;justify-content:center}.ctl::before{font-size:25px;line-height:1}.play{width:66px;height:66px}.play::before{content:'▶'}.ctl#prev::before{content:'⏮'}.ctl#next::before{content:'⏭'}.ctl#shuffle::before{content:'↝';font-size:28px}.ctl#repeat::before{content:'↻';font-size:27px}.ctl.active{background:#fff;color:#111}.active{outline:3px solid #fff}.status{color:#aaa;margin-top:14px;text-align:center}.qrBtn{position:fixed;right:18px;bottom:18px;z-index:50;width:48px;height:48px;border:1px solid #555;border-radius:50%;background:#202020;color:#fff;font-weight:900}.qrBox{position:fixed;right:18px;bottom:76px;z-index:49;background:#fff;color:#111;border-radius:16px;padding:10px;width:230px;text-align:center;box-shadow:0 15px 45px #0009;display:none}.qrBox.show{display:block}.qrBox img{width:210px;height:210px;display:block}.queue{margin-top:18px;overflow:auto;border-top:1px solid #333;padding-top:12px}.queue:before{content:'Poradie';display:block;font-weight:800;font-size:17px;margin-bottom:9px}.qi{padding:9px;border-radius:9px;font-size:14px}.qi.on{background:#292929;font-weight:800}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{grid-template-columns:minmax(0,1.35fr) minmax(350px,.85fr)}}@media(max-width:700px){body.remoteMode{overflow:auto;background:#0f0f0f}.remote{padding:18px}.remote h1{font-size:26px}.remoteForm{display:flex;gap:8px}.remoteForm input{flex:1;min-width:0;background:#202020;border:1px solid #444;border-radius:22px;color:#fff;padding:13px 16px;font-size:18px}.remoteForm button{border:0;border-radius:20px;padding:0 16px;font-weight:800}.remoteGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.remoteCard{background:#181818;border-radius:13px;overflow:hidden}.remoteCard img{width:100%;aspect-ratio:16/9;object-fit:cover}.remoteCard div{padding:8px;font-size:13px;font-weight:750}}</style></head><body>
