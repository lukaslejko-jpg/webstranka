<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music for Tesla</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b0c0e;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.top{height:70px;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #25272b}.logo{font-size:24px;font-weight:800}.search{flex:1;max-width:720px;border:1px solid #444;background:#17191d;color:#fff;border-radius:24px;padding:12px 18px;font-size:18px}.go,.nav button,.tool{border:0;border-radius:18px;padding:10px 15px;background:#25282d;color:#fff;font-weight:700}.go{background:#fff;color:#111}.nav{display:flex;gap:6px}.nav button.active{background:#fff;color:#111}
.main{height:calc(100vh - 70px);display:grid;grid-template-columns:minmax(430px,46%) 7px 1fr;--browse:46%}.browse{overflow:auto;padding:16px 18px}.player{min-width:0;padding:14px 16px;display:flex;flex-direction:column;border-left:1px solid #25272b}.splitter{cursor:col-resize;background:#22252a}
.title{font-size:22px;font-weight:800;margin:2px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{cursor:pointer;min-width:0}.thumbWrap{position:relative;aspect-ratio:16/9;background:#16181b;border-radius:12px;overflow:hidden}.thumb{width:100%;height:100%;object-fit:cover}.dur{position:absolute;right:6px;bottom:6px;background:#000c;padding:3px 6px;border-radius:5px}.ct{font-weight:750;font-size:15px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ca{color:#aaa;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video{width:100%;flex:1;min-height:0;background:#000;border-radius:14px;overflow:hidden}.video iframe,#yt{width:100%;height:100%}.meta{padding:10px 2px 5px}.now{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#aaa;margin-top:3px}.controls{display:flex;align-items:center;gap:10px;padding:7px 0}.controls button{border:0;background:#24272c;color:#fff;border-radius:50%;width:44px;height:44px;font-size:19px}.controls #play{width:52px;height:52px;background:#fff;color:#111}.timeline{display:grid;grid-template-columns:44px 1fr 48px;align-items:center;gap:8px;font-size:12px;color:#aaa}.timeline input{width:100%}.queue{display:none}.status{font-size:13px;color:#aaa;margin:8px 0}.filters{display:flex;gap:7px;overflow:auto;margin:8px 0 12px}.filters button{white-space:nowrap;border:0;border-radius:15px;padding:7px 10px;background:#22252a;color:#ddd}.filters button.active{background:#fff;color:#111}.qrBtn{position:fixed;right:18px;bottom:16px;z-index:20}.qrBox{display:none;position:fixed;right:18px;bottom:70px;background:#fff;padding:10px;border-radius:14px;z-index:30}.qrBox.show{display:block}.qrBox img{width:220px;height:220px}
@media(min-width:1500px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.main{grid-template-columns:minmax(520px,48%) 7px 1fr}}

.searchBox{position:relative;flex:1;max-width:720px}.searchBox .search{width:100%;padding-right:46px}.clearSearch{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:#30343a;color:#fff;font-size:22px;line-height:1}.chips,.playerTools{display:flex;gap:8px;margin:7px 0 12px}.chips button,.playerTools button{border:0;border-radius:999px;padding:8px 13px;background:#24272c;color:#ddd;font-weight:700}.chips button.active,.playerTools button.active{background:#f4f4f4;color:#111}
.video{min-height:260px}.timeRow{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-top:2px}.seek{width:100%;accent-color:#fff}
.controls{justify-content:center}.controls button::before{display:block}.controls #prev::before{content:"◀◀";font-size:14px}.controls #play::before{content:"▶";font-size:22px}.controls #next::before{content:"▶▶";font-size:14px}.controls #shuffle::before{content:"🔀";font-size:20px}.controls #repeat::before{content:"🔁";font-size:20px}.controls #shuffle,.controls #repeat{position:relative}.controls button.active{background:#f4f4f4!important;color:#111!important;box-shadow:0 0 0 2px #f4f4f433}.controls button:not(.active){background:#24272c;color:#fff}
.qrBtn{width:48px;height:48px;padding:0;border:1px solid #555;border-radius:50%;background:#1e2126;color:#fff;font-weight:800;font-size:14px}.qrBox{text-align:center;color:#111;max-width:250px;font-size:12px}.qrBox img{display:block;margin:auto auto 8px}

.remoteMode{overflow:auto!important}.remote{min-height:100vh;background:#0b0c0e;color:#fff;padding:14px;font-family:Arial,sans-serif}.remote .rTop{position:sticky;top:0;z-index:5;background:#0b0c0ef2;padding:8px 0 12px}.remote .rTop b{display:block;font-size:24px;margin-bottom:10px}.remote form{display:flex;gap:8px}.remote input{min-width:0;flex:1;height:44px;border:1px solid #444;border-radius:22px;background:#191b1f;color:#fff;padding:0 16px;font-size:16px}.remote form button{height:44px;border:0;border-radius:22px;background:#fff;color:#111;padding:0 18px;font-weight:800}.remote #rst{font-size:14px;color:#aaa;margin:9px 2px}.remoteGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.remoteCard{display:block;width:100%;padding:0;border:0;background:#15171a;color:#fff;border-radius:12px;overflow:hidden;text-align:left}.remoteCard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.remoteCard span{display:block;padding:9px;font-size:14px;font-weight:700;line-height:1.25}.remoteCard:active{transform:scale(.98);background:#292c31}@media(max-width:420px){.remote{padding:10px}.remoteGrid{gap:9px}.remoteCard span{font-size:13px;padding:7px}}

.fav{position:absolute;left:7px;top:7px;width:34px;height:34px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:22px;line-height:34px;padding:0;z-index:3}.fav.on{background:#fff;color:#111}.card:hover .thumb{transform:scale(1.015)}.thumb{transition:transform .15s ease}

/* Mobile: search and navigation must fit the viewport without clipping. */
@media(max-width:850px){html,body{overflow:auto;height:auto;min-height:100%;}.top{height:auto;min-height:68px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:10px 12px;align-items:center}.logo{font-size:21px}.searchBox{min-width:0;max-width:none}.searchBox .search{width:100%;min-width:0;font-size:16px;padding:11px 40px 11px 12px}.go{padding:11px 12px;white-space:nowrap}.nav{grid-column:1/-1;display:flex;max-width:100%;overflow-x:auto;gap:7px;padding:3px 0 5px;scrollbar-width:none}.nav button{flex:0 0 auto;white-space:nowrap;padding:10px 12px}.main{height:auto;min-height:calc(100dvh - 124px);display:flex;flex-direction:column}.browse{min-height:42dvh;max-height:none;overflow:visible;padding:14px 12px}.player{min-height:380px;padding:12px;border-left:0;border-top:1px solid #25272b}.splitter{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.title{font-size:20px;overflow-wrap:anywhere}.video{min-height:220px}.qrBtn{right:12px;bottom:12px}}
@media(max-width:390px){.top{grid-template-columns:auto minmax(0,1fr) auto}.logo{font-size:18px}.go{padding:9px}.grid{gap:8px}}

@media(max-width:850px){.main.music-playing{display:flex;flex-direction:column}.main.music-playing .player{order:0}.main.music-playing .browse{order:1}.main.music-minimized .player{position:sticky;top:0;z-index:15;min-height:0;padding:8px 12px;background:#15171b;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;border-bottom:1px solid #333}.main.music-minimized .playerTools{grid-column:2;grid-row:1;margin:0}.main.music-minimized .video,.main.music-minimized .artist,.main.music-minimized .seek,.main.music-minimized .timeRow,.main.music-minimized .controls,.main.music-minimized .status,.main.music-minimized .queue{display:none!important}.main.music-minimized .now{grid-column:1;grid-row:1;font-size:14px;align-self:center;margin:0}.main.music-minimized .browse{order:1}.main.music-playing:not(.music-minimized) .player{min-height:0}.main.music-playing:not(.music-minimized) .video{aspect-ratio:16/9;min-height:0;flex:none}.main.music-playing:not(.music-minimized) .video iframe{height:100%}.playerTools #minimizePlayer{background:#fff;color:#111}}
@media(min-width:851px){#minimizePlayer{display:none}}

@media(max-width:850px){body.musicPlaying .main{display:flex;flex-direction:column}body.musicPlaying:not(.miniPlayer) .player{order:-1;min-height:0}body.musicPlaying:not(.miniPlayer) .browse{order:1}body.musicPlaying:not(.miniPlayer) .video{height:44vw;max-height:290px;min-height:180px;flex:none}body.musicPlaying.miniPlayer .player{position:fixed;bottom:0;left:0;right:0;z-index:19;min-height:0;height:76px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:5px;background:#181a1e;border-top:1px solid #555;padding:7px 12px;box-shadow:0 -5px 25px #0008}body.musicPlaying.miniPlayer .browse{padding-bottom:100px}body.musicPlaying.miniPlayer .player .video,body.musicPlaying.miniPlayer .player .artist,body.musicPlaying.miniPlayer .player .seek,body.musicPlaying.miniPlayer .player .timeRow,body.musicPlaying.miniPlayer .player .status,body.musicPlaying.miniPlayer .player .playerTools,body.musicPlaying.miniPlayer .player #prev,body.musicPlaying.miniPlayer .player #next,body.musicPlaying.miniPlayer .player #shuffle,body.musicPlaying.miniPlayer .player #repeat{display:none}body.musicPlaying.miniPlayer .player .now{font-size:14px;min-width:0;grid-column:1}body.musicPlaying.miniPlayer .player .controls{grid-column:2;padding:0}body.musicPlaying.miniPlayer .player .controls #play{width:42px;height:42px}body.musicPlaying.miniPlayer #miniToggle{position:fixed;bottom:83px;right:12px;z-index:21}}
#miniToggle{display:none}@media(max-width:850px){body.musicPlaying.miniPlayer #miniToggle{display:block;position:fixed;left:12px;right:auto;bottom:calc(90px + env(safe-area-inset-bottom, 0px));z-index:22;border:1px solid #777;border-radius:24px;background:#fff;color:#111;font-weight:700;padding:10px 13px}body.musicPlaying:not(.miniPlayer) #miniToggle{display:none}}
</style></head><body>
<div id="remoteApp" style="display:none"></div><div id="desktopApp"><div class="top"><div class="logo">Music</div><form id="searchForm" action="/" method="get" style="display:contents"><div class="searchBox"><input id="q" class="search" type="text" name="q" autocomplete="off" spellcheck="false" placeholder="Hľadať na YouTube"><button id="clearSearch" class="clearSearch" type="button">×</button></div><button id="go" class="go" type="submit">Hľadať</button></form><div class="nav"><button class="active" data-view="home">Pre teba</button><button data-view="search">Vyhľadané</button><button data-view="likes">Obľúbené</button><button data-view="recent">Naposledy</button></div></div>
<div id="main" class="main"><section class="browse"><h2 id="heading" class="title">Pre teba</h2><div id="chips" class="chips"><button class="chip active" data-filter="music">Hudba</button><button class="chip" data-filter="similar">Podobná hudba</button><button class="chip" data-filter="artist">Interpret</button></div><div id="searchFeedback" class="status" role="status" aria-live="polite"></div><div id="grid" class="grid"></div></section><div id="splitter" class="splitter" title="Potiahni pre zmenu veľkosti"></div><aside class="player"><div class="playerTools"><button id="swap" type="button">⇄ Prehodiť</button><button id="wide" type="button">▣ Player</button><button id="minimizePlayer" type="button" aria-label="Minimalizovať prehrávač" aria-expanded="true">Zmenšiť ▾</button></div><div class="video"><div id="yt"></div></div><div id="now" class="now">Vyber skladbu</div><div id="artist" class="artist">YouTube</div><input id="seek" class="seek" type="range" min="0" max="1000" value="0"><div class="timeRow"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div><div class="controls"><button id="prev" class="ctl" aria-label="Predchádzajúca"></button><button id="play" class="ctl play" aria-label="Prehrať"></button><button id="next" class="ctl" aria-label="Ďalšia"></button><button id="shuffle" class="ctl" aria-label="Náhodne"></button><button id="repeat" class="ctl repeat" aria-label="Opakovať"></button></div><div id="status" class="status">Pripravené</div><div id="queue" class="queue"></div></aside></div></div><button id="miniToggle" type="button" aria-label="Minimalizovať prehrávač">Zmenšiť ▾</button><button id="qrBtn" class="qrBtn" type="button">QR</button><div id="qrBox" class="qrBox"><img id="qrImg" alt="QR"><div>Vyhľadaj na mobile a pošli skladbu do Tesly</div></div>
