<!doctype html><html lang="sk"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="music-offline-version" content="20261004-02"><title>Music Offline MULTI</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fa;color:#111827}.w{max-width:720px;margin:auto;padding:20px 14px}h1{font-size:27px;margin:4px 0}.sub,.meta{color:#667085}.sub{margin:0 0 16px}.search{display:flex;gap:7px}.search input{flex:1;min-width:0;padding:13px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}button{border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;padding:12px 15px}.results{display:none;margin-top:10px;height:360px;overflow-y:scroll;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px;background:#f5f7fa;border:1px solid #d0d5dd;border-radius:14px}.results.open{display:grid;gap:8px}.row{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;text-align:left;background:#fff;color:#111827;border:1px solid #e4e7ec;padding:8px}.row img{width:58px;height:58px;object-fit:cover;border-radius:8px}.sel,.offline{margin-top:14px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:11px}.sel{display:none}.dl,.imp{width:100%;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.card{min-width:0;border:1px solid #e4e7ec;border-radius:11px;padding:8px;background:#f8fafc}.name{font-weight:700;font-size:12px;line-height:1.25;word-break:break-word;min-height:30px}.card .meta{font-size:11px;margin-top:3px}.card video{width:100%;aspect-ratio:16/9;background:#000;border-radius:7px;margin-top:7px}.card audio{width:100%;height:34px;margin-top:7px}.tools{display:flex;gap:6px;margin-top:10px}.tools button{padding:8px 10px;font-size:12px;background:#e9eefb;color:#1d4ed8}.tools button.on{background:#2563eb;color:white}.libq{width:100%;margin-top:8px;padding:10px;border:1px solid #d0d5dd;border-radius:10px}.card{position:relative}.del{position:absolute;top:5px;right:5px;width:20px;height:20px;padding:0;border-radius:50%;background:#fff;color:#b4231 </style><main class=w><h1>Music Offline</h1><p class=sub>TEST03 MULTI</p><form class=search id=f><input id=q placeholder="Hľadať skladbu alebo interpreta"><button>Hľadať</button></form><div id=m class=meta></div><div id=r class=results></div><section id=sel class=sel><b id=st></b><div id=sa class=meta></div><button id=dl class=dl>Stiahnuť do mobilu</button><div id=s class=meta></div></section><section class=offline><b>Offline v Music</b><div class=meta>Importuj hotové audio/video zo Súborov → Stiahnuté.</div><button id=imp class=imp>Importovať zo Stiahnutých</button><input id=pick type=file multiple accept="audio/*,video/mp4,.mp3,.m4a,.aac,.mp4" hidden><div class=tools><button data-filter=all class=on>Všetko</button><button data-filter=audio>Audio</button><button data-filter=video>Video</button></div><input id=libq class=libq placeholder="Hľadať v uložených"><div id=count class=count></div><div id=grid class=grid></div></section></main><script>
const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let chosen=null,items=[];
$('f').onsubmit=async e=>{e.preventDefault();let q=$('q').value.trim();if(q.length<2)return;$('m').textContent='Hľadám…';$('r').innerHTML='';$('sel').style.display='none';try{let x=await fetch('https://music-offline-test03-clean.onrender.com/api/search?q='+encodeURIComponent(q)),j=await x.json();items=j.items||j.results||[];$('m').textContent=items.length?'Vyber skladbu · '+items.length+' výsledkov':'Nič som nenašiel.';$('r').classList.toggle('open',items.length>0);$('r').innerHTML=items.map((v,i)=>'<button class=row data-i="'+i+'"><img src="'+esc(v.thumbnail||v.thumbnailUrl||v.image||((v.videoId||v.id)?'https://i.ytimg.com/vi/'+encodeURIComponent(v.videoId||v.id)+'/hqdefault.jpg':''))+'"><div><b>'+esc(v.title)+'</b><div class=meta>'+esc(v.artist||v.author||v.channel||'')+'</div></div></button>').join('')}catch{$('m').textContent='Vyhľadávanie je nedostupné.'}};
$('r').onclick=e=>{let b=e.target.closest('[data-i]');if(!b)return;let v=items[+b.dataset.i],id=v.videoId||v.id;chosen={...v,url:v.url||(id?'https://www.youtube.com/watch?v='+id:'')};$('st').textContent=v.title||'';$('sa').textContent=v.artist||v.author||v.channel||'';$('s').textContent='';$('sel').style.display='block';$('r').classList.remove('open')};
$('dl').onclick=()=>{if(!chosen?.url)return;$('s').textContent='Otváram Palladium…';location.href='palladium://download?url='+encodeURIComponent(chosen.url)};
const DB='music-offline-test03-multi',STORE='media';function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function key(f){return f.name+'|'+f.size+'|'+(f.lastModified||0)}async function save(f){let d=await db();await new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(f,key(f));t.oncomplete=ok;t.onerror=()=>no(t.error)});d.close()}async function all(){let d=await db();return await new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>{d.close();ok(r.result||[])};r.onerror=()=>no(r.error)})}let filter='all';async function removeKey(k){if(!confirm('Vymazať túto položku z Music?'))return;let d=await db();await new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).delete(k);t.oncomplete=ok;t.onerror=()=>no(t.error)});d.close();render()}async function render(){let fs=await all(),q=($('libq')?.value||'').toLowerCase();fs=fs.filter(f=>{let v=f.type.startsWith('video/')||/\\.mp4$/i.test(f.name);return(filter==='all'||(filter==='video'&&v)||(filter==='audio'&&!v))&&(!q||f.name.toLowerCase().includes(q))});$('count').textContent=fs.length?fs.length+' zobrazené':'Nič na zobrazenie';$('grid').innerHTML='';for(let f of fs){let u=URL.createObjectURL(f),v=f.type.startsWith('video/')||/\\.mp4$/i.test(f.name),d=document.createElement('div');d.className='card';d.innerHTML='<div class=name>'+esc(f.name)+'</div><div class=meta>'+Math.round(f.size/1048576*10)/10+' MB · '+(v?'Video':'Audio')+'</div>'+(v?'<video controls playsinline preload=metadata src="'+u+'"></video>':'<audio controls preload=metadata src="'+u+'"></audio>')+'<button class=del aria-label="Vymazať" title="Vymazať" data-key="'+esc(key(f))+'">🗑</button>';$('grid').appendChild(d)}}$('grid').onclick=e=>{let b=e.target.closest('.del');if(b)removeKey(b.dataset.key)};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});$('libq').oninput=render;$('imp').onclick=()=>$('pick').click();$('pick').onchange=async()=>{for(let f of Array.from($('pick').files||[]))await save(f);$('pick').value='';await render()};render();
</script>
