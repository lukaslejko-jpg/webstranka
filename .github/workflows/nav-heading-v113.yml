name: Navigation heading-up V113
on:
  push:
    branches: [tesla-waze-v113-work]
    paths: ['.github/workflows/nav-heading-v113.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v113-work
          fetch-depth: 0
      - name: Patch heading-up only
        shell: python
        run: |
          from pathlib import Path
          p=Path('tesla-waze-preview/app.js')
          s=p.read_text(encoding='utf-8')
          old="if(changed&&now-(state.freeDriveBearingAt||0)>=1200){if(typeof state.map.setHeading==='function')state.map.setHeading(h,{ease:1,deadzone:0});else if(typeof state.map.setBearing==='function')state.map.setBearing(-h);state.freeDriveHeading=h;state.freeDriveBearingAt=now}"
          new="if(changed&&now-(state.freeDriveBearingAt||0)>=1200){if(typeof state.map.setBearing==='function')state.map.setBearing(h);else if(typeof state.map.setHeading==='function')state.map.setHeading(h,{ease:0,deadzone:0});state.freeDriveHeading=h;state.freeDriveBearingAt=now}/* FREE_DRIVE_BEARING_MATCH_V113 */"
          assert old in s
          s=s.replace(old,new,1)
          old2="else if(!state.navigating){state.car.setLatLng(p);updateFreeDriveHeading(p,moved,sp)}"
          new2="else if(!state.navigating){state.car.setLatLng(p);state.car.setRotationAngle?.(0);updateFreeDriveHeading(p,moved,sp)}/* CAR_UP_LOCK_V113 */"
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify and gzip
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'FREE_DRIVE_BEARING_MATCH_V113' tesla-waze-preview/app.js
          grep -q 'CAR_UP_LOCK_V113' tesla-waze-preview/app.js
          gzip -n -9 -c tesla-waze-preview/app.js | base64 -w0 > tesla-waze-preview/app.js.gz.b64
          base64 -d tesla-waze-preview/app.js.gz.b64 | gzip -dc | cmp - tesla-waze-preview/app.js
      - name: Commit V113
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git commit -m 'nav: force map and arrow heading-up V113 [skip ci]'
          git push origin HEAD:tesla-waze-v113-work
