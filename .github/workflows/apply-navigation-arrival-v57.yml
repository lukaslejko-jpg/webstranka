name: Apply navigation destination arrival V57

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - 'tesla-waze-preview/navigation-arrival-fix-patch.py'
      - '.github/workflows/apply-navigation-arrival-v57.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply destination arrival fix
        run: python3 tesla-waze-preview/navigation-arrival-fix-patch.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'NAV_DESTINATION_ARRIVAL_V57' tesla-waze-preview/app.js
          grep -q "if(op.includes('DESTINATION'))return '✓';" tesla-waze-preview/app.js
          grep -q 'function routeDestinationProjection(r)' tesla-waze-preview/app.js
          grep -q "displayText=arrived?'Cieľ dosiahnutý'" tesla-waze-preview/app.js
          grep -q 'effectiveRouteEnd:total' tesla-waze-preview/app.js
      - name: Rebuild JS asset
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          gzip -n -c app.js > app.js.gz
          gzip -t app.js.gz
          base64 -w 0 app.js.gz > app.js.gz.b64
          base64 -d app.js.gz.b64 > verify.gz
          cmp <(gzip -dc verify.gz) app.js
          rm -f app.js.gz verify.gz
      - name: Commit V57
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          if git diff --cached --quiet; then echo 'V57 already applied.'; exit 0; fi
          git commit -m 'nav: stop route at real destination and fix arrival icon'
          git push origin HEAD:tesla-waze-preview-v1
