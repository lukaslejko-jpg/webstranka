name: Tesla Music refactor gate

on:
  push:
    branches:
      - refactor/tesla-music-playback-core-20260923
    paths:
      - 'tesla-music-production/**'
      - '.github/workflows/tesla-music-refactor-gate.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Syntax checks
        run: |
          node --check tesla-music-production/app-v7.js
          node --check tesla-music-production/mobile-controls-v40.js
          node --check tesla-music-production/mobile-v128-music-logic.js
          node --check tesla-music-production/desktop-silence-v63.js
          node --check tesla-music-production/desktop-route-v52.js
          node --check tesla-music-production/mode-v9.js
          node --check tesla-music-production/desktop-v97-youtube-search.js
          node --check tesla-music-production/member-v49-search-layout.js
          node --check tesla-music-production/member-v50-foryou.js
          node --check tesla-music-production/mobile-v106-player-parity.js

      - name: Architectural guards
        run: |
          node <<'NODE'
          const fs=require('fs');
          const mobileUi=fs.readFileSync('tesla-music-production/mobile-v106-player-parity.js','utf8');
          const mobileUiGuard=mobileUi.split('\n').find(line=>line.includes("location.pathname"))||'';
          if(!mobileUiGuard.includes("if(!/^\\/(?:index\\.html)?$/.test(location.pathname))return")) throw new Error('mobile-v106 route guard is not root-only: '+mobileUiGuard);
          const mobile=fs.readFileSync('tesla-music-production/mobile-v128-music-logic.js','utf8');
          const firstCode=mobile.split('\n').find(line=>line.includes("location.pathname"))||'';
          if(!firstCode.includes("if(!/^\\/(?:index\\.html)?$/.test(location.pathname))return")) throw new Error('mobile-v128 route guard is not root-only: '+firstCode);
          const silence=fs.readFileSync('tesla-music-production/desktop-silence-v63.js','utf8');
          if(/new\s+Audio\s*\(/.test(silence)||/playVideo\s*\(/.test(silence)||/silence\.wav/.test(silence)) throw new Error('desktop silence bridge still contains playback code');
          const app=fs.readFileSync('tesla-music-production/app-v7.js','utf8');
          if(/c>=d-1\.1/.test(app)||/autoEndedKey===k\)next\(false\)/.test(app)) throw new Error('base app still contains duplicate AUTO transition');
          if(/ENDED\)\{if\(current\)ev\('complete',current\);if\(settings\.auto\)next\(false\)/.test(app)) throw new Error('base app ENDED still advances playback');
          const ownershipFiles=[
            'tesla-music-production/mode-v9.js',
            'tesla-music-production/mobile-v128-music-logic.js',
            'tesla-music-production/desktop-v97-youtube-search.js'
          ];
          for(const file of ownershipFiles){
            const code=fs.readFileSync(file,'utf8');
            if(/\bnext\s*=/.test(code)||/\bprev\s*=/.test(code)||/\bplayTrack\s*=/.test(code)) throw new Error('unexpected playback override in '+file);
            if(/setActionHandler\(['"]nexttrack/.test(code)||/setActionHandler\(['"]previoustrack/.test(code)) throw new Error('unexpected media-session playback override in '+file);
          }
          const forYou=fs.readFileSync('tesla-music-production/member-v50-foryou.js','utf8');
          if(/appendChild\s*\(/.test(forYou)||/setTimeout\s*\(\s*reorder/.test(forYou)) throw new Error('member-v50 still mutates rendered DOM after paint');
          const vercel=JSON.parse(fs.readFileSync('tesla-music-production/vercel.json','utf8'));
          if(!(vercel.redirects||[]).some(r=>r.source==='/desktop/'&&r.destination==='/desktop')) throw new Error('/desktop/ normalization missing');
          const rescue=fs.readFileSync('tesla-music-production/rescue-v135.js','utf8');
          if(/setInterval\s*\(/.test(rescue)) throw new Error('rescue polling still active');
          const playCalls=(rescue.match(/\.playVideo\s*\(/g)||[]).length;
          if(playCalls>1) throw new Error('rescue playVideo spam still active: '+playCalls);
          NODE

      - name: Mobile playback regression
        env:
          TESLA_MOBILE_ONLY: '1'
        run: node tesla-music-production/test-current-production-playback-fix.cjs

      - name: Desktop boot smoke without mobile playback layer
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox']});
            const ctx=await browser.newContext({serviceWorkers:'block',viewport:{width:1280,height:800}});
            const page=await ctx.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://tesla-waze-piped.vercel.app/desktop',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#q',{timeout:15000});
            await page.waitForSelector('#go',{timeout:15000});
            await page.waitForSelector('[data-tab="queue"]',{timeout:15000});
            const title=await page.title();
            const queueLabel=(await page.locator('[data-tab="queue"]').textContent()||'').trim();
            if(!/Music/i.test(title))throw new Error('desktop title missing');
            if(!/Vyhľadané|Poradie/.test(queueLabel))throw new Error('desktop queue label missing: '+queueLabel);
            if(errors.length)throw new Error('desktop page errors: '+errors.join('; '));
            await browser.close();
            console.log('DESKTOP_BOOT_SMOKE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
