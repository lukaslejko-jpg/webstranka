name: Apply Smart Music compact header V73
on:
  push:
    branches: [tesla-waze-v72-work]
    paths:
      - 'tesla-waze-preview/music-compact-header-v73-patch.py'
      - '.github/workflows/apply-music-compact-header-v73.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v72-work
      - name: Apply V73 patch
        run: python tesla-waze-preview/music-compact-header-v73-patch.py
      - name: Check JS syntax
        run: node --check tesla-waze-preview/app.js
      - name: Check V73 invariants
        run: |
          grep -q 'MUSIC_COMPACT_HEADER_V73' tesla-waze-preview/app.js
          grep -q 'MUSIC_COMPACT_HEADER_V73' tesla-waze-preview/app.css
          grep -q "const compact=!shell.classList.contains('music-maximized')" tesla-waze-preview/app.js
          grep -q '.music-shell:not(.music-maximized) .music-head-actions' tesla-waze-preview/app.css
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' tesla-waze-preview/app.css
      - name: Rebuild runtime assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,base64
          for name in ['app.js','app.css']:
              p=Path('tesla-waze-preview')/name
              raw=p.read_bytes()
              out=base64.b64encode(gzip.compress(raw,mtime=0)).decode('ascii')+'\n'
              (p.parent/(name+'.gz.b64')).write_text(out,encoding='ascii')
              assert gzip.decompress(base64.b64decode(out))==raw
          PY
      - name: Commit runtime V73
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          git diff --cached --quiet && exit 0
          git commit -m 'music: compact Smart Music header V73'
          git push origin HEAD:tesla-waze-v72-work
