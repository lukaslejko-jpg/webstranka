name: Apply Smart Music search history V62

on:
  push:
    branches: [tesla-waze-preview-v1]
    paths:
      - '.github/workflows/apply-music-v62.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply V62
        run: python3 tesla-waze-preview/music-max-search-v62-patch.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'MUSIC_MAX_SEARCH_HISTORY_V62' tesla-waze-preview/app.js
          grep -q 'MUSIC_MAX_SEARCH_HISTORY_V62' tesla-waze-preview/app.css
          grep -q "MUSIC_SEARCH_HISTORY_KEY='teslaWaze:musicSearchHistory:v1'" tesla-waze-preview/app.js
          grep -q 'musicHeaderBackBtn' tesla-waze-preview/app.js
          grep -q 'NAV_LOCAL_CORRIDOR_V58' tesla-waze-preview/app.js
          grep -q 'MUSIC_STARTUP_NAV_GUARD_V47' tesla-waze-preview/app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tesla-waze-preview/app.js').read_text()
          block=s.split('function ensureMusicWindowControls(){',1)[1].split('function syncMusicFab',1)[0]
          assert "hs.id='musicHeaderSearch'" not in block
          assert "const size=document.createElement('button')" in block
          assert "const min=document.createElement('button')" in block
          PY
      - name: Rebuild assets
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          for f in app.js app.css; do
            gzip -n -c "$f" | base64 -w 0 > "$f.gz.b64"
            test -s "$f.gz.b64"
            base64 -d "$f.gz.b64" > verify.gz
            gzip -t verify.gz
            cmp <(gzip -dc verify.gz) "$f"
            rm -f verify.gz
          done
      - name: Commit V62
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'music: restore classic window and remember searches'
          git push origin HEAD:tesla-waze-preview-v1
