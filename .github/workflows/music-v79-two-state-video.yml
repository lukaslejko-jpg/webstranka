name: Smart Music V79 two-state video
on:
  push:
    branches: [tesla-waze-v79-work]
    paths:
      - 'tesla-waze-preview/music-v79-two-state-video-patch.py'
      - '.github/workflows/music-v79-two-state-video.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v79-work
      - name: Apply V79 patch
        run: python tesla-waze-preview/music-v79-two-state-video-patch.py
      - name: Check JS syntax
        run: node --check tesla-waze-preview/app.js
      - name: Check V79 invariants
        run: |
          grep -q 'MUSIC_TWO_STATE_VIDEO_V79' tesla-waze-preview/app.js
          grep -q 'MUSIC_TWO_STATE_VIDEO_V79' tesla-waze-preview/app.css
          ! grep -q "isMax?'Pôvodný rozmer':'Maximalizovať'" tesla-waze-preview/app.js
          grep -q "isMax?'Minimalizovať':'Maximalizovať'" tesla-waze-preview/app.js
          grep -q "music-video-open" tesla-waze-preview/app.js
          grep -q "#musicVideo" tesla-waze-preview/app.css
      - name: Rebuild exact runtime assets
        run: |
          python -c "from pathlib import Path; import gzip,base64; p=Path('tesla-waze-preview/app.js'); b=base64.b64encode(gzip.compress(p.read_bytes(),mtime=0)).decode(); Path('tesla-waze-preview/app.js.gz.b64').write_text(b,encoding='ascii'); assert gzip.decompress(base64.b64decode(b))==p.read_bytes()"
          python -c "from pathlib import Path; import gzip,base64; p=Path('tesla-waze-preview/app.css'); b=base64.b64encode(gzip.compress(p.read_bytes(),mtime=0)).decode(); Path('tesla-waze-preview/app.css.gz.b64').write_text(b,encoding='ascii'); assert gzip.decompress(base64.b64decode(b))==p.read_bytes()"
      - name: Commit V79 runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          git diff --cached --quiet && exit 0
          git commit -m 'music: two-state controls and video V79'
          git push origin HEAD:tesla-waze-v79-work
