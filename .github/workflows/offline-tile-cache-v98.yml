name: Offline tile cache V98

on:
  push:
    branches: [tesla-waze-v98-work]
    paths:
      - '.github/workflows/offline-tile-cache-v98.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply V98') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v98-work
          fetch-depth: 0
      - name: Register additive offline tile layer
        shell: python
        run: |
          from pathlib import Path
          p=Path('tesla-waze-preview/app.js')
          s=p.read_text()
          marker='/* OFFLINE_TILE_CACHE_V98 */'
          if marker not in s:
              needle="'use strict';\n"
              assert needle in s, 'app.js strict-mode anchor missing'
              code=r'''/* OFFLINE_TILE_CACHE_V98 */
          const V98_BRANCH_PATH='/lukaslejko-jpg/webstranka/tesla-waze-preview-v1/tesla-waze-preview/';
          if(location.hostname==='raw.githack.com'&&!location.pathname.startsWith(V98_BRANCH_PATH)){
            location.replace('https://raw.githack.com'+V98_BRANCH_PATH+'live3.html'+location.search+location.hash);
            return;
          }
          if('serviceWorker' in navigator&&location.hostname==='raw.githack.com'){
            const sendNetworkState=()=>{try{navigator.serviceWorker.controller?.postMessage({type:'TESLA_NETWORK_STATE',online:navigator.onLine!==false})}catch{}};
            navigator.serviceWorker.register('./offline-sw-v98.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(()=>sendNetworkState()).catch(e=>console.warn('Offline tile cache unavailable:',e?.message||e));
            navigator.serviceWorker.addEventListener('controllerchange',sendNetworkState);
            window.addEventListener('online',sendNetworkState);
            window.addEventListener('offline',sendNetworkState);
          }
          '''
              s=s.replace(needle,needle+code,1)
              p.write_text(s)
      - name: Verify JS and preserved core functions
        run: |
          node --check tesla-waze-preview/app.js
          grep -q 'OFFLINE_TILE_CACHE_V98' tesla-waze-preview/app.js
          grep -q "navigator.serviceWorker.register('./offline-sw-v98.js'" tesla-waze-preview/app.js
          grep -q 'TESLA_NETWORK_STATE' tesla-waze-preview/app.js
          grep -q 'function nearestNavigation' tesla-waze-preview/app.js
          grep -q 'function applyHeadingUp' tesla-waze-preview/app.js
          grep -q 'function renderTraffic' tesla-waze-preview/app.js
          grep -q 'function mnext' tesla-waze-preview/app.js
          grep -q 'gain.gain.value=state.voiceVolume' tesla-waze-preview/app.js
      - name: Rebuild JS runtime asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,base64
          raw=Path('tesla-waze-preview/app.js').read_bytes()
          enc=base64.b64encode(gzip.compress(raw,compresslevel=9,mtime=0)).decode('ascii')
          Path('tesla-waze-preview/app.js.gz.b64').write_text(enc)
          assert gzip.decompress(base64.b64decode(enc))==raw
          PY
      - name: Verify generated scope
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = $'tesla-waze-preview/app.js\ntesla-waze-preview/app.js.gz.b64'
      - name: Commit V98 runtime registration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git commit -m 'offline: apply V98 transparent tile cache registration'
          git push origin HEAD:tesla-waze-v98-work
