name: Fix Tesla Waze 04 traffic

on:
  push:
    branches:
      - debug/tesla-waze-decode-20260903
    paths:
      - .github/workflows/fix-tesla-waze-04-traffic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/tesla-waze-decode-20260903
          path: debugsrc
      - name: Validate route traffic source
        run: >-
          curl -fsS --get https://dimvegkezslqjtsxdohp.supabase.co/functions/v1/twroute
          --data-urlencode fromLat=48.9984
          --data-urlencode fromLng=21.2393
          --data-urlencode toLat=48.7164
          --data-urlencode toLng=21.2611
          --data-urlencode useVignette=true
          --data-urlencode avoidTolls=false
          --data-urlencode avoidFerries=false
          -o /tmp/route.json
      - name: Validate route traffic JSON
        run: python -c "import json;d=json.load(open('/tmp/route.json'));assert not d.get('error'),d.get('error');assert isinstance(d.get('routes'),list) and d['routes'];r=d['routes'][0];assert isinstance(r.get('trafficJams'),list);print('route traffic OK',len(d['routes']),len(r['trafficJams']))"
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
          path: live
      - name: Patch live traffic
        run: cd live && python ../debugsrc/.github/scripts/fix-tesla-waze-04-route-traffic.py
      - name: Commit live asset only
        working-directory: live
        run: |
          git config user.name "lukaslejko-jpg"
          git config user.email "lukaslejko@gmail.com"
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git diff --cached --check
          git commit -m "Fix 04 restore route traffic and voice warnings" || exit 0
          git push origin HEAD:tesla-waze-preview-v1
