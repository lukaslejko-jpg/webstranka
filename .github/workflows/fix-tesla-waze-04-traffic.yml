name: Fix Tesla Waze 04 traffic

on:
  push:
    branches:
      - debug/tesla-waze-decode-20260903
    paths:
      - .github/workflows/fix-tesla-waze-04-traffic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/tesla-waze-decode-20260903
          path: debugsrc
      - name: Validate Waze traffic bridge
        run: >-
          curl -fsS --get https://dimvegkezslqjtsxdohp.supabase.co/functions/v1/twtraffic
          --data-urlencode left=21.05
          --data-urlencode right=21.45
          --data-urlencode bottom=48.90
          --data-urlencode top=49.15
          -o /tmp/traffic.json
      - name: Validate traffic JSON
        run: python -c "import json;d=json.load(open('/tmp/traffic.json'));assert not d.get('error'),d.get('error');assert isinstance(d.get('alerts'),list);assert isinstance(d.get('jams'),list);print('traffic OK',len(d['alerts']),len(d['jams']))"
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
          path: live
      - name: Patch live asset
        run: cd live && python ../debugsrc/.github/scripts/fix-tesla-waze-04-traffic.py
      - name: Commit live asset only
        working-directory: live
        run: |
          git config user.name "lukaslejko-jpg"
          git config user.email "lukaslejko@gmail.com"
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git diff --cached --check
          git commit -m "Fix 04 restore live traffic and voice warnings" || exit 0
          git push origin HEAD:tesla-waze-preview-v1
