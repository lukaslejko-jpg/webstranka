name: Tesla Music mobile Offline V28 sources

on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/mobile-offline-v28-sources.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
          fetch-depth: 0
      - name: Apply V28
        run: python3 scripts/patch_offline_v28_sources.py
      - name: Verify
        run: |
          set -euo pipefail
          node --check tesla-music-v7-preview/offline-v20.js
          grep -q '__TESLA_OFFLINE_V28__' tesla-music-v7-preview/offline-v20.js
          grep -q 'async function findCcMixter' tesla-music-v7-preview/offline-v20.js
          grep -q 'collection:(netlabels)' tesla-music-v7-preview/offline-v20.js
          grep -q 'page_size=80' tesla-music-v7-preview/offline-v20.js
          grep -q '## 8. Offline V28' docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
          ! grep -q 'twmusic-offline-queue' tesla-music-v7-preview/offline-v20.js
      - name: Commit V28
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-music-v7-preview/offline-v20.js docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(tesla-music): expand free offline sources V28'
          git push origin HEAD:tesla-music-v6-preview
