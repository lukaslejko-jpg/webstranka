name: Apply Smart Music display filter V56

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - 'tesla-waze-preview/music-display-latin-filter-patch.py'
      - '.github/workflows/apply-music-display-v56.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply display filter
        run: python3 tesla-waze-preview/music-display-latin-filter-patch.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'MUSIC_DISPLAY_LATIN_FILTER_V56' tesla-waze-preview/app.js
          grep -q 'MUSIC_HOME_POLISH_V55' tesla-waze-preview/app.js
          grep -q 'slice(0,10)' tesla-waze-preview/app.js
      - name: Rebuild JS asset
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          gzip -n -c app.js > app.js.gz
          gzip -t app.js.gz
          base64 -w 0 app.js.gz > app.js.gz.b64
          base64 -d app.js.gz.b64 > verify.gz
          cmp <(gzip -dc verify.gz) app.js
          rm -f app.js.gz verify.gz
      - name: Commit V56
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          if git diff --cached --quiet; then echo 'V56 already applied.'; exit 0; fi
          git commit -m 'music: remove unsupported Tesla metadata glyphs'
          git push origin HEAD:tesla-waze-preview-v1
