name: Fix Tesla Music mobile search target branch v33
on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/fix-mobile-search-target-branch-v33.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
      - name: Patch anonymous search endpoint and favicon
        shell: python
        run: |
          from pathlib import Path
          p=Path('tesla-music-v7-preview/app-v7.js')
          s=p.read_text()
          old="https://dimvegkezslqjtsxdohp.supabase.co/functions/v1/twyoutubesearch?q="
          if old not in s:
              print('Supabase search already absent')
          s=s.replace(old,"/api/youtube-search?q=")
          p.write_text(s)
          i=Path('tesla-music-v7-preview/index.html')
          h=i.read_text()
          if 'rel="icon"' not in h:
              h=h.replace('<title>Tesla Music</title>','<title>Tesla Music</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23111827%27/%3E%3Cpath d=%27M39 14v28.5a9 9 0 1 1-5-8.1V20l18-4v21.5a9 9 0 1 1-5-8.1V14z%27 fill=%27white%27/%3E%3C/svg%3E">')
              i.write_text(h)
      - name: Verify
        run: |
          grep -q "/api/youtube-search?q=" tesla-music-v7-preview/app-v7.js
          ! grep -q "dimvegkezslqjtsxdohp.supabase.co/functions/v1/twyoutubesearch" tesla-music-v7-preview/app-v7.js
          grep -q 'rel="icon"' tesla-music-v7-preview/index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tesla-music-v7-preview/app-v7.js tesla-music-v7-preview/index.html
          git diff --cached --quiet || git commit -m "fix(tesla-music): restore anonymous search on mobile branch"
          git push origin HEAD:tesla-music-v6-preview
