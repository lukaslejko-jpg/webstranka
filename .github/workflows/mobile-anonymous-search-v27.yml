name: Tesla Music mobile anonymous search V27

on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/mobile-anonymous-search-v27.yml'
      - 'scripts/mobile_anonymous_search_v27.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
          fetch-depth: 0
      - name: Patch mobile search
        run: python3 scripts/mobile_anonymous_search_v27.py
      - name: Verify
        run: |
          set -euo pipefail
          node --check tesla-music-v7-preview/app-v7.js
          grep -q "const SEARCH_API='/api/youtube-search?q='" tesla-music-v7-preview/app-v7.js
          ! grep -q 'dimvegkezslqjtsxdohp.supabase.co/functions/v1/twyoutubesearch' tesla-music-v7-preview/app-v7.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-music-v7-preview/app-v7.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(tesla-music): anonymous search via Vercel API'
          git push origin HEAD:tesla-music-v6-preview
