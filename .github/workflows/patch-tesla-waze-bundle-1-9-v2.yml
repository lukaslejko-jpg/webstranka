name: Run Tesla Waze UX bundle patcher
on:
  push:
    branches:
      - debug/tesla-waze-bundle-1-9
    paths:
      - .github/workflows/patch-tesla-waze-bundle-1-9-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare live branch
        run: |
          cp tools/patch_tesla_waze_bundle_1_9.py /tmp/patch_tesla_waze_bundle_1_9.py
          git fetch origin tesla-waze-preview-v1
          git checkout -B live origin/tesla-waze-preview-v1
      - name: Apply patch
        run: python /tmp/patch_tesla_waze_bundle_1_9.py
      - name: Syntax check
        run: node --check tesla-waze-preview/app.js
      - name: Commit live assets
        run: |
          git config user.name lukaslejko-jpg
          git config user.email lukaslejko@gmail.com
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          git commit -m "Fix UX bundle: camera, traffic, chargers, places, recents and music FAB"
          git push origin HEAD:tesla-waze-preview-v1
