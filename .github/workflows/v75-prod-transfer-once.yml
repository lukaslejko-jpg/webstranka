name: V75 production transfer once

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - '.github/workflows/v75-prod-transfer-once.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0

      - name: Copy only approved V75 CSS runtime
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_JS=$(git hash-object tesla-waze-preview/app.js)
          BEFORE_JSGZ=$(git hash-object tesla-waze-preview/app.js.gz.b64)
          git show 04213e711681bf764f08b314cbee91f30d0d8e04:tesla-waze-preview/app.css > tesla-waze-preview/app.css
          git show 04213e711681bf764f08b314cbee91f30d0d8e04:tesla-waze-preview/app.css.gz.b64 > tesla-waze-preview/app.css.gz.b64
          grep -q 'MUSIC_COMPACT_HEADER_V75' tesla-waze-preview/app.css
          grep -q 'grid-template-columns:1fr!important' tesla-waze-preview/app.css
          grep -q 'grid-template-rows:repeat(3,44px)!important' tesla-waze-preview/app.css
          test "$BEFORE_JS" = "$(git hash-object tesla-waze-preview/app.js)"
          test "$BEFORE_JSGZ" = "$(git hash-object tesla-waze-preview/app.js.gz.b64)"
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n%s\n' 'tesla-waze-preview/app.css' 'tesla-waze-preview/app.css.gz.b64' | sort)
          test "$CHANGED" = "$EXPECTED"

      - name: Commit only V75 CSS runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.css tesla-waze-preview/app.css.gz.b64
          git commit -m 'music: deploy approved compact Smart Music V75 [skip ci]'
          git push origin HEAD:tesla-waze-preview-v1
