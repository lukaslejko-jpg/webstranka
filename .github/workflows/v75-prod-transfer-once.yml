name: V75 production transfer once

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - '.github/workflows/v75-prod-transfer-once.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0

      - name: Fetch approved V75 work branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tesla-waze-v75-work:refs/remotes/origin/tesla-waze-v75-work
          test "$(git rev-parse origin/tesla-waze-v75-work)" = "04213e711681bf764f08b314cbee91f30d0d8e04"

      - name: Copy only approved V75 CSS runtime
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_JS=$(git hash-object tesla-waze-preview/app.js)
          BEFORE_JSGZ=$(git hash-object tesla-waze-preview/app.js.gz.b64)
          git show origin/tesla-waze-v75-work:tesla-waze-preview/app.css > tesla-waze-preview/app.css
          git show origin/tesla-waze-v75-work:tesla-waze-preview/app.css.gz.b64 > tesla-waze-preview/app.css.gz.b64
          grep -q 'MUSIC_COMPACT_HEADER_V75' tesla-waze-preview/app.css
          test "$BEFORE_JS" = "$(git hash-object tesla-waze-preview/app.js)"
          test "$BEFORE_JSGZ" = "$(git hash-object tesla-waze-preview/app.js.gz.b64)"
          git diff --quiet -- tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git status --short

      - name: Commit only V75 CSS runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.css tesla-waze-preview/app.css.gz.b64
          git diff --cached --quiet && { echo 'No V75 CSS changes to commit'; exit 1; }
          git diff --cached --name-only | grep -qx 'tesla-waze-preview/app.css'
          git diff --cached --name-only | grep -qx 'tesla-waze-preview/app.css.gz.b64'
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'music: deploy approved compact Smart Music V75 [skip ci]'
          git push origin HEAD:tesla-waze-preview-v1
