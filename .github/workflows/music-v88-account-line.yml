name: Smart Music V88 connected account line
on:
  push:
    branches: [tesla-waze-v88-work]
    paths:
      - 'tesla-waze-preview/music-v88-account-line-patch.py'
      - '.github/workflows/music-v88-account-line.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v88-work
      - name: Apply V88 patch
        run: python tesla-waze-preview/music-v88-account-line-patch.py
      - name: Syntax check
        run: node --check tesla-waze-preview/app.js
      - name: Verify account line only
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tesla-waze-preview/app.js').read_text()
          c=Path('tesla-waze-preview/app.css').read_text()
          assert s.count('MUSIC_ACCOUNT_LINE_V88')==1
          assert 'id="musicCompactAccount"' in s
          assert "`${y.email} · synchronizované`" in s
          assert "'YouTube nepripojený'" in s
          assert c.count('MUSIC_ACCOUNT_LINE_V88')==1
          assert '.music-compact-account{' in c
          assert "$('musicCompactSync').onclick=connectYoutube" in s
          PY
      - name: Rebuild runtime payloads
        run: |
          python - <<'PY'
          import gzip,base64,pathlib
          for name in ['app.js','app.css']:
              p=pathlib.Path('tesla-waze-preview')/name
              raw=p.read_bytes()
              out=base64.b64encode(gzip.compress(raw,mtime=0)).decode()
              q=pathlib.Path('tesla-waze-preview')/(name+'.gz.b64')
              q.write_text(out,encoding='ascii')
              assert gzip.decompress(base64.b64decode(out))==raw
          PY
      - name: Commit V88
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css tesla-waze-preview/app.css.gz.b64
          git commit -m 'music: show connected account in compact header V88'
          git push origin HEAD:tesla-waze-v88-work
