name: Fix Tesla Waze 01 search UI

on:
  push:
    branches:
      - debug/tesla-waze-decode-20260903
    paths:
      - .github/workflows/fix-tesla-waze-01-search-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live Tesla Waze branch
        uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Hide search while navigating and restore on stop
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, base64
          p = Path('tesla-waze-preview/app.js')
          s = p.read_text(encoding='utf-8')
          old = "function moveSearchToNavigation(on){\n  ensureTeslaNavUI();\n  const sb=document.querySelector('.searchbox'),dock=$('teslaSearchDock');\n  if(!sb||!dock)return;\n  if(on){dock.classList.remove('hidden');if(sb.parentNode!==dock)dock.appendChild(sb)}\n  else{dock.classList.add('hidden');if(state.searchHome?.parentNode&&sb.parentNode===dock)state.searchHome.parentNode.insertBefore(sb,state.searchHome.nextSibling)}\n}"
          new = "function moveSearchToNavigation(on){\n  ensureTeslaNavUI();\n  const sb=document.querySelector('.searchbox'),dock=$('teslaSearchDock');\n  if(!sb||!dock)return;\n  dock.classList.add('hidden');\n  if(on){\n    sb.classList.add('hidden');\n  }else{\n    if(state.searchHome?.parentNode&&sb.parentNode===dock)state.searchHome.parentNode.insertBefore(sb,state.searchHome.nextSibling);\n    sb.classList.remove('hidden');\n  }\n}"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one search UI block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          packed = gzip.compress(s.encode('utf-8'), compresslevel=9, mtime=0)
          Path('tesla-waze-preview/app.js.gz.b64').write_text(base64.b64encode(packed).decode('ascii'), encoding='ascii')
          PY
      - name: Commit live asset only
        run: |
          git config user.name "lukaslejko-jpg"
          git config user.email "lukaslejko@gmail.com"
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git diff --cached --check
          git commit -m "Fix 01 hide search during navigation" || exit 0
          git push origin HEAD:tesla-waze-preview-v1
