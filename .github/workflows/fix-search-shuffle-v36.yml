name: Fix Tesla Music search and shuffle v36
on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/fix-search-shuffle-v36.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
      - name: Patch mode runtime guard and shuffle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tesla-music-v7-preview/mode-v9.js')
          s=p.read_text()
          s=s.replace("CTX_FETCH='https://dimvegkezslqjtsxdohp.supabase.co/functions/v1/twyoutubesearch'","CTX_FETCH='/api/youtube-search'")
          if 'SEARCH_SHUFFLE_GUARD_V36' not in s:
              ins="""(()=>{\n  /* SEARCH_SHUFFLE_GUARD_V36 */\n  try{const nf=window.fetch.bind(window);window.fetch=(input,init)=>{try{const u=typeof input==='string'?input:(input&&input.url)||'';if(u.includes('dimvegkezslqjtsxdohp.supabase.co/functions/v1/twyoutubesearch')){const x=new URL(u,location.href),q=x.searchParams.get('q')||'';return nf('/api/youtube-search?q='+encodeURIComponent(q),{...(init||{}),cache:'no-store'})}}catch{}return nf(input,init)}}catch{}\n  const fixShuffle=()=>{const b=document.getElementById('shuffle');if(!b)return;b.innerHTML='<svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" aria-hidden=\"true\"><path d=\"M4 7h3.5c2.2 0 3.5 1.1 4.8 3.2l1.4 2.3c1.2 2 2.5 3 4.8 3H21M16.5 12.5 21 16l-4.5 3.5M4 17h3.5c1.7 0 2.9-.7 3.9-2.2M16.5 4.5 21 8l-4.5 3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>';b.title='Náhodné prehrávanie';b.setAttribute('aria-label','Náhodné prehrávanie')};\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fixShuffle,{once:true});else fixShuffle();setTimeout(fixShuffle,300);setTimeout(fixShuffle,1200);\n"""
              s=s.replace('(()=>{\n',ins,1)
          p.write_text(s)
          a=Path('tesla-music-v7-preview/app-v7.js').read_text()
          assert '/api/youtube-search?q=' in a
          assert 'dimvegkezslqjtsxdohp.supabase.co/functions/v1/twyoutubesearch' not in a
          PY
          node --check tesla-music-v7-preview/mode-v9.js
          grep -q SEARCH_SHUFFLE_GUARD_V36 tesla-music-v7-preview/mode-v9.js
          grep -q "CTX_FETCH='/api/youtube-search'" tesla-music-v7-preview/mode-v9.js
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tesla-music-v7-preview/mode-v9.js
          git diff --cached --quiet || git commit -m "fix(tesla-music): harden search and shuffle icon"
          git push origin HEAD:tesla-music-v6-preview
