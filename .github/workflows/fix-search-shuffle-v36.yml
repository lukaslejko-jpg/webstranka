name: Fix Tesla Music search icon v38
on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/fix-search-shuffle-v36.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
      - name: Repair Tesla Music only
        shell: python
        run: |
          from pathlib import Path
          import re
          base=Path('tesla-music-v7-preview')
          old='https://dimvegkezslqjtsxdohp.supabase.co/functions/v1/twyoutubesearch'

          # Search: force every Tesla Music search path to the working same-origin endpoint.
          for fn in ['app-v7.js','mode-v9.js','account-v8.js']:
              p=base/fn
              s=p.read_text(encoding='utf-8')
              s=s.replace(old, '/api/youtube-search')
              p.write_text(s, encoding='utf-8')

          # Remove old runtime favicon injector from account-v8.js; it overrode the page icon.
          p=base/'account-v8.js'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'^/\* TESLA_MUSIC_SELECTED_ICON_V36 \*/\n\(\(\)=>\{try\{document\.querySelectorAll\(.*?\}\}\)\(\);\n', '', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          # Stable external SVG icon instead of data URI / corrupted 35-byte PNG.
          icon=base/'tesla-music-icon.svg'
          icon.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#111827"/><path d="M39 14v28.5a8.5 8.5 0 1 1-4-7.2V20l18-4v22.5a8.5 8.5 0 1 1-4-7.2V12z" fill="#fff"/></svg>''', encoding='utf-8')

          p=base/'index.html'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="icon"[^>]*>', '', s)
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', '', s)
          s=s.replace('<title>Tesla Music</title>', '<title>Tesla Music</title><link rel="icon" type="image/svg+xml" href="./tesla-music-icon.svg?v=38"><link rel="shortcut icon" href="./tesla-music-icon.svg?v=38"><link rel="apple-touch-icon" href="./apple-touch-icon.jpg?v=38">', 1)
          s=s.replace('data-tab="queue">Queue<', 'data-tab="queue">Poradie<')
          if 'id="shuffle" class="ctl">' in s:
              s=s.replace('<button id="shuffle" class="ctl">⤨</button>', '<button id="shuffle" class="ctl" aria-label="Náhodné prehrávanie" title="Náhodné prehrávanie"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M4 7h3.5c2.2 0 3.5 1.1 4.8 3.2l1.4 2.3c1.2 2 2.5 3 4.8 3H21M16.5 12.5 21 16l-4.5 3.5M4 17h3.5c1.7 0 2.9-.7 3.9-2.2M16.5 4.5 21 8l-4.5 3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>')
          p.write_text(s, encoding='utf-8')

          # Hard verification: no stale Supabase search remains in live Tesla Music files.
          for fn in ['app-v7.js','mode-v9.js','account-v8.js']:
              s=(base/fn).read_text(encoding='utf-8')
              assert old not in s, fn
          assert '/api/youtube-search' in (base/'app-v7.js').read_text(encoding='utf-8')
          assert '/api/youtube-search' in (base/'mode-v9.js').read_text(encoding='utf-8')
          html=(base/'index.html').read_text(encoding='utf-8')
          assert './tesla-music-icon.svg?v=38' in html
          assert 'data-tab="queue">Poradie<' in html
      - name: Syntax check
        run: |
          node --check tesla-music-v7-preview/app-v7.js
          node --check tesla-music-v7-preview/mode-v9.js
          node --check tesla-music-v7-preview/account-v8.js
      - name: Commit repaired Tesla Music files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tesla-music-v7-preview/app-v7.js tesla-music-v7-preview/mode-v9.js tesla-music-v7-preview/account-v8.js tesla-music-v7-preview/index.html tesla-music-v7-preview/tesla-music-icon.svg
          git diff --cached --quiet || git commit -m "fix(tesla-music): restore search and stable icon v38"
          git push origin HEAD:tesla-music-v6-preview
