name: Music mobile V107
on:
  push:
    branches: [tesla-waze-v107-work]
    paths: ['.github/workflows/music-mobile-v107.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v107-work
          fetch-depth: 0
      - name: Patch V107 mobile max layout and search
        shell: python
        run: |
          from pathlib import Path
          p=Path('tesla-waze-preview/live3.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="stylesheet" href="./mobile-v102.css?v=105" />\n','')
          old="const st=document.createElement('style');st.textContent=ung(css64);document.head.appendChild(st);"
          new="const st=document.createElement('style');st.textContent=ung(css64);document.head.appendChild(st);const mob=document.createElement('link');mob.rel='stylesheet';mob.href='./mobile-v102.css?v=107';document.head.appendChild(mob);"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          c=Path('tesla-waze-preview/mobile-v102.css')
          css='''/* MUSIC_MOBILE_FINAL_V107 */\n@media(max-width:900px){\n  html body .music-shell.music-maximized{width:100vw!important;max-width:100vw!important;height:100dvh!important;border-left:0!important}\n  html body .music-shell.music-maximized .music-head{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important;padding:8px 10px 10px!important;position:relative!important;z-index:8000!important;background:#0f1720!important;overflow:visible!important;pointer-events:auto!important}\n  html body .music-shell.music-maximized .music-head-brand,html body .music-shell.music-maximized .music-head-sync,html body .music-shell.music-maximized .music-head>.spacer{display:none!important}\n  html body .music-shell.music-maximized #musicHeaderSearch{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:6px!important;width:100%!important;min-width:0!important;margin:0!important;order:1!important;position:relative!important;z-index:2!important;pointer-events:auto!important}\n  html body .music-shell.music-maximized #musicHeaderSearch .music-header-search-field{min-width:0!important;width:100%!important}\n  html body .music-shell.music-maximized #musicHeaderSearch input{display:block!important;width:100%!important;min-width:0!important;height:44px!important;min-height:44px!important}\n  html body .music-shell.music-maximized #musicHeaderSearch .music-header-search-btn{display:flex!important;align-items:center!important;justify-content:center!important;height:44px!important;min-height:44px!important;min-width:92px!important;padding:0 12px!important}\n  html body .music-shell.music-maximized .music-head-actions{order:2!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;width:100%!important;position:relative!important;z-index:2!important;pointer-events:auto!important}\n  html body .music-shell.music-maximized .music-head-actions #musicAds{display:none!important}\n  html body .music-shell.music-maximized .music-head-actions .btn{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-width:0!important;max-width:none!important;min-height:44px!important;height:44px!important;padding:0 7px!important;font-size:12px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;pointer-events:auto!important;position:relative!important;z-index:3!important}\n  html body .music-shell.music-maximized #musicMobileMaxSearch{display:none!important}\n  html body .music-shell.music-maximized .music-player{position:relative!important;z-index:1!important;padding:10px!important;pointer-events:auto!important}\n  html body .music-shell.music-maximized .music-player .yt-player{display:none!important;position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;inset:auto!important;transform:none!important;width:100%!important;max-width:100%!important;max-height:none!important;margin:8px 0!important;z-index:auto!important}\n  html body .music-shell.music-maximized.music-video-open .music-player .yt-player{display:block!important;position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;inset:auto!important;transform:none!important;width:100%!important;max-width:100%!important;max-height:36dvh!important;margin:8px 0!important;z-index:auto!important}\n  html body .music-shell.music-maximized.music-searching>.music-body>#musicMaxHome{display:none!important}\n  html body .music-shell.music-maximized.music-searching>.music-body>#musicSearchCard{display:block!important;background:transparent!important;border:0!important;padding:0!important;margin:0!important}\n  html body .music-shell.music-maximized.music-searching>.music-body>#musicSearchCard>.row{display:none!important}\n  html body .music-shell.music-maximized.music-searching>.music-body>#musicSearchCard>#musicSearchResults{display:block!important}\n  html body .music-shell.music-maximized:not(.music-searching)>.music-body>#musicSearchCard{display:none!important}\n}\n'''
          c.write_text(css,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'MUSIC_MOBILE_FINAL_V107' tesla-waze-preview/mobile-v102.css
          grep -q "mobile-v102.css?v=107" tesla-waze-preview/live3.html
          grep -q "#musicAds{display:none" tesla-waze-preview/mobile-v102.css
          grep -q "music-searching>.music-body>#musicSearchCard" tesla-waze-preview/mobile-v102.css
      - name: Commit V107
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/live3.html tesla-waze-preview/mobile-v102.css
          git commit -m 'music: fix mobile max controls and search V107 [skip ci]'
          git push origin HEAD:tesla-waze-v107-work
