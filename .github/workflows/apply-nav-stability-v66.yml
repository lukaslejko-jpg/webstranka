name: Apply navigation stability V66
on:
  push:
    branches: [tesla-waze-preview-v1]
    paths:
      - 'tesla-waze-preview/navigation-stability-voice-v66-patch.py'
      - '.github/workflows/apply-nav-stability-v66.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply V66
        run: python tesla-waze-preview/navigation-stability-voice-v66-patch.py
      - name: Verify
        run: |
          grep -q 'NAV_GPS_VOICE_STABILITY_V66' tesla-waze-preview/app.js
          grep -q 'voiceManeuverHistory' tesla-waze-preview/app.js
          node --check tesla-waze-preview/app.js
      - name: Rebuild JS asset
        run: |
          python - <<'PY'
          import gzip,base64,pathlib
          p=pathlib.Path('tesla-waze-preview/app.js')
          data=gzip.compress(p.read_bytes(),compresslevel=9)
          pathlib.Path('tesla-waze-preview/app.js.gz.b64').write_text(base64.b64encode(data).decode(),encoding='utf-8')
          PY
      - name: Commit V66
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git diff --cached --quiet || git commit -m 'nav: stabilize GPS camera and voice guidance'
          git push origin HEAD:tesla-waze-preview-v1
