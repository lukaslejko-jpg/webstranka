name: Inspect Music 158 file tree

on:
  push:
    branches: [fix/music-qr-minimized-preview-20260926]
    paths: ['.github/workflows/inspect-music-158-tree.yml']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEAM_ID: team_dev6vKKH2V0qxtGe0uy6GpT6
      BASE_DPL: dpl_Bd6H4i853jeN7SstdpzLz9npZMLx
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --global vercel@59.25.4
      - name: Auth
        env: { GH_STATUS_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          LOG=/tmp/a; timeout 300 vercel login --github >"$LOG" 2>&1 & PID=$!
          for _ in $(seq 1 60); do URL="$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" 2>/dev/null|tail -n1||true)"; [ -n "$URL" ]&&break; sleep 1; done
          CODE="${URL##*user_code=}"
          node - "$CODE" "$URL" <<'NODE' >/tmp/s.json
          const [code,url]=process.argv.slice(2);process.stdout.write(JSON.stringify({state:'pending',context:'music-tree-auth',description:'Vercel code: '+code,target_url:url}));
          NODE
          curl -fsS -X POST -H "Authorization: Bearer $GH_STATUS_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/s.json >/dev/null
          wait "$PID"
      - name: Fetch and summarize raw tree
        run: |
          set -euo pipefail
          vercel api "/v6/deployments/$BASE_DPL/files?teamId=$TEAM_ID" > /tmp/tree.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/tree.json','utf8'));
          console.log('TYPE='+typeof x+' ARRAY='+Array.isArray(x));
          console.log('KEYS='+(x&&typeof x==='object'?Object.keys(x).join(','):''));
          console.log(JSON.stringify(x,null,2).slice(0,50000));
          NODE

