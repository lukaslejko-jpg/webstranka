name: Inspect Tesla Music native media controls V40
on:
  push:
    branches: [tesla-music-v6-preview]
    paths: ['.github/workflows/inspect-tesla-music-controls-v40.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public player without changing production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p /tmp/tm40 && cd /tmp/tm40
          npm init -y >/dev/null
          npm install playwright@1.55.1
          npx playwright install chromium
          cat > inspect.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            console.log('DEPLOY_CREDENTIAL_CONFIGURED',Boolean(process.env.VERCEL_TOKEN));
            const browser=await chromium.launch({args:['--no-sandbox']});
            try {
              const page=await browser.newPage();
              await page.addInitScript(()=>{
                window.__mediaActions={};
                if(navigator.mediaSession){const original=navigator.mediaSession.setActionHandler.bind(navigator.mediaSession);navigator.mediaSession.setActionHandler=(a,h)=>{window.__mediaActions[a]=typeof h==='function';return original(a,h);};}
              });
              await page.goto('https://tesla-waze-piped.vercel.app/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>typeof ready!=='undefined'&&ready,{},{timeout:30000});
              await page.evaluate(()=>{window.teslaMusicSetVideo?.(true);player.loadVideoById('unfzfe8f9NI');});
              await page.waitForTimeout(2500);
              for(const f of page.frames())console.log('SINGLE_SESSION',f.url(),await f.evaluate(()=>({actions:window.__mediaActions,video:!!document.querySelector('video')})).catch(()=>null));
              await page.evaluate(()=>player.loadPlaylist(['unfzfe8f9NI','xFrGuyw1V8s','XEjLoHdbVeE'],0,0));
              await page.waitForTimeout(2500);
              for(const f of page.frames())console.log('PLAYLIST_SESSION',f.url(),await f.evaluate(()=>({actions:window.__mediaActions,video:!!document.querySelector('video')})).catch(()=>null));
              console.log('PLAYLIST_STATE',await page.evaluate(()=>({list:player.getPlaylist(),state:player.getPlayerState()})));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node inspect.cjs
