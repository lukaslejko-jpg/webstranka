name: Test Tesla Music V155 production alias

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-tesla-music-v155-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_dev6vKKH2V0qxtGe0uy6GpT6
      VERCEL_PROJECT_ID: prj_3UUsvRZV5rzNI7Qdkt4LzBYWEPwe
      TARGET_DEPLOYMENT: dpl_5gBLzGmWZZ3m9bzDgvzQhAGQBwfC
      PROD_URL: https://tesla-waze-piped.vercel.app
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@59.25.4
      - name: Authenticate Vercel CLI
        run: |
          echo "Authorize this CLI session in Vercel."
          timeout 300 vercel login --github
      - name: Verify CLI identity
        run: vercel whoami
      - name: Point production to immutable V155
        run: vercel rollback "$TARGET_DEPLOYMENT" --yes --scope lukaslejko-9932s-projects
      - name: Verify production
        run: |
          sleep 5
          vercel inspect "$PROD_URL" --scope lukaslejko-9932s-projects
