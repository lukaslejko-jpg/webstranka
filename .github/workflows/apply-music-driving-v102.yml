name: Apply Smart Music driving stability v102

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - 'tesla-waze-preview/music-driving-stability-v102-patch.py'
      - '.github/workflows/apply-music-driving-v102.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tesla Waze branch
        uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0

      - name: Apply v102 refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-driving-stability-v102-patch.py

      - name: Verify JavaScript and markers
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'MUSIC_DRIVING_STABILITY_V101' tesla-waze-preview/app.js
          grep -q 'MUSIC_DRIVING_STABILITY_V102' tesla-waze-preview/app.js
          grep -q 'MUSIC_DRIVING_UI_V101' tesla-waze-preview/app.css
          grep -q 'MUSIC_DRIVING_UI_V102' tesla-waze-preview/app.css
          grep -q 'teslaWaze:musicDrivingV102Migrated' tesla-waze-preview/app.js
          ! grep -q 'function drainManualMusicNav' tesla-waze-preview/app.js
          ! grep -q 'function scheduleManualMusicNav' tesla-waze-preview/app.js
          ! grep -q "music.autoNext=true;music.shuffle=true" tesla-waze-preview/app.js

      - name: Rebuild and verify runtime assets
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          for f in app.js app.css; do
            gzip -n -c "$f" > "$f.gz"
            gzip -t "$f.gz"
            base64 -w 0 "$f.gz" > "$f.gz.b64"
            base64 -d "$f.gz.b64" > verify.gz
            gzip -t verify.gz
            cmp <(gzip -dc verify.gz) "$f"
            rm -f "$f.gz" verify.gz
          done

      - name: Commit patched source and runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          if git diff --cached --quiet; then
            echo 'Driving stability v102 already applied.'
            exit 0
          fi
          git commit -m 'music: finalize driving UI and single-step next v102'
          git push origin HEAD:tesla-waze-preview-v1
