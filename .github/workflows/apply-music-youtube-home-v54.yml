name: Apply Smart Music YouTube home V54

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - 'tesla-waze-preview/music-youtube-home-patch.py'
      - '.github/workflows/apply-music-youtube-home-v54.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply YouTube-style Smart Music home
        run: python3 tesla-waze-preview/music-youtube-home-patch.py
      - name: Verify JS and layout markers
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'MUSIC_YOUTUBE_HOME_V54' tesla-waze-preview/app.js
          grep -q 'MUSIC_YOUTUBE_HOME_V54' tesla-waze-preview/app.css
          grep -q "section('Rýchly výber'" tesla-waze-preview/app.js
          grep -q "section('Obľúbené'" tesla-waze-preview/app.js
          grep -q "section('Naposledy prehrané'" tesla-waze-preview/app.js
          grep -q 'music-home-covers' tesla-waze-preview/app.css
          grep -q 'music-home-rows' tesla-waze-preview/app.css
          grep -q 'MUSIC_QUALITY_FILTER_V52' tesla-waze-preview/app.js
          grep -q 'MUSIC_MANUAL_GUARD_V47' tesla-waze-preview/app.js
      - name: Rebuild JS and CSS assets
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          for f in app.js app.css; do
            gzip -n -c "$f" > "$f.gz"
            gzip -t "$f.gz"
            base64 -w 0 "$f.gz" > "$f.gz.b64"
            base64 -d "$f.gz.b64" > verify.gz
            cmp <(gzip -dc verify.gz) "$f"
            rm -f "$f.gz" verify.gz
          done
      - name: Commit V54 assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          if git diff --cached --quiet; then echo 'V54 already applied.'; exit 0; fi
          git commit -m 'music: use YouTube-style maximized home'
          git push origin HEAD:tesla-waze-preview-v1
