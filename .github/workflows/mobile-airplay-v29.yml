name: Tesla Music mobile AirPlay V29

on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/mobile-airplay-v29.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
          fetch-depth: 0
      - name: Apply AirPlay V29
        run: python3 scripts/patch_airplay_v29.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-music-v7-preview/offline-v20.js
          grep -q '__TESLA_OFFLINE_V29__' tesla-music-v7-preview/offline-v20.js
          grep -q '__TESLA_AIRPLAY_V29__' tesla-music-v7-preview/offline-v20.js
          grep -q 'webkitShowPlaybackTargetPicker' tesla-music-v7-preview/offline-v20.js
          grep -q "x-webkit-airplay','allow" tesla-music-v7-preview/offline-v20.js
          grep -q "qs.get('map')==='1'||qs.get('embed')==='1'" tesla-music-v7-preview/offline-v20.js
      - name: Commit AirPlay V29
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-music-v7-preview/offline-v20.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(tesla-music): add AirPlay system output V29'
          git push origin HEAD:tesla-music-v6-preview
