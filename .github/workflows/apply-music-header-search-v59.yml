name: Apply Smart Music header search V59

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - 'tesla-waze-preview/music-header-search-patch.py'
      - '.github/workflows/apply-music-header-search-v59.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply header search
        run: python3 tesla-waze-preview/music-header-search-patch.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'MUSIC_HEADER_SEARCH_V59' tesla-waze-preview/app.js
          grep -q 'MUSIC_HEADER_SEARCH_V59' tesla-waze-preview/app.css
          grep -q 'musicHeaderSearchInput' tesla-waze-preview/app.js
          grep -q 'musicHeaderSearchBtn' tesla-waze-preview/app.js
          grep -q 'MUSIC_YOUTUBE_HOME_V54' tesla-waze-preview/app.js
          grep -q 'MUSIC_QUALITY_FILTER_V52' tesla-waze-preview/app.js
          grep -q 'NAV_LOCAL_CORRIDOR_V58' tesla-waze-preview/app.js
      - name: Rebuild assets
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          for f in app.js app.css; do
            gzip -n -c "$f" > "$f.gz"
            gzip -t "$f.gz"
            base64 -w 0 "$f.gz" > "$f.gz.b64"
            base64 -d "$f.gz.b64" > verify.gz
            cmp <(gzip -dc verify.gz) "$f"
            rm -f "$f.gz" verify.gz
          done
      - name: Commit V59
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          if git diff --cached --quiet; then echo 'V59 already applied.'; exit 0; fi
          git commit -m 'music: add search to Smart Music header'
          git push origin HEAD:tesla-waze-preview-v1
