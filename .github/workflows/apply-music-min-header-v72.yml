name: Apply Smart Music minimized header V72
on:
  push:
    branches: [tesla-waze-v72-work]
    paths:
      - 'tesla-waze-preview/music-minimized-header-v72-patch.py'
      - '.github/workflows/apply-music-min-header-v72.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v72-work
          fetch-depth: 0
      - name: Apply V72 UI patch
        run: python tesla-waze-preview/music-minimized-header-v72-patch.py
      - name: Verify JavaScript syntax and UI invariants
        run: |
          node --check tesla-waze-preview/app.js
          python - <<'PY'
          from pathlib import Path
          js=Path('tesla-waze-preview/app.js').read_text()
          css=Path('tesla-waze-preview/app.css').read_text()
          assert js.count('/* MUSIC_MIN_HEADER_V72 */') == 1
          assert css.count('/* MUSIC_MIN_HEADER_V72 */') == 1
          for token in ['musicHeaderSyncSlot','music-head-actions','syncMusicMinimizedHeader','Späť na plochu']:
              assert token in js, token
          for token in ["grid-template-areas:'brand sync' 'actions actions'",'grid-template-columns:repeat(3,minmax(0,1fr))','music-head-sync-btn']:
              assert token in css, token
          # Existing functional IDs must remain exactly once in the static app sources.
          for token in ["$('youtubeSync')","$('musicMinimize')","$('musicSize')","$('closeMusic')"]:
              assert token in js, token
          print('V72 invariants OK')
          PY
      - name: Rebuild compressed runtime assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,base64
          for name in ['app.js','app.css']:
              p=Path('tesla-waze-preview')/name
              raw=p.read_bytes()
              packed=gzip.compress(raw,compresslevel=9,mtime=0)
              (p.parent/(name+'.gz.b64')).write_text(base64.b64encode(packed).decode('ascii'))
          PY
      - name: Verify compressed assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,base64
          for name in ['app.js','app.css']:
              p=Path('tesla-waze-preview')/name
              b64=(p.parent/(name+'.gz.b64')).read_text().strip()
              assert gzip.decompress(base64.b64decode(b64)) == p.read_bytes(), name
          print('compressed assets match')
          PY
      - name: Verify scope
        run: |
          python - <<'PY'
          import subprocess
          allowed={'tesla-waze-preview/app.js','tesla-waze-preview/app.css','tesla-waze-preview/app.js.gz.b64','tesla-waze-preview/app.css.gz.b64'}
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed and changed <= allowed, changed
          print('runtime scope:', sorted(changed))
          PY
      - name: Commit V72 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          git commit -m 'music: reorganize minimized Smart Music header V72'
          git push origin HEAD:tesla-waze-v72-work
