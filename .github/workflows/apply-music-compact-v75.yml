name: Apply Smart Music compact header V75
on:
  push:
    branches: [tesla-waze-v75-work]
    paths:
      - 'tesla-waze-preview/music-compact-header-v75-patch.py'
      - '.github/workflows/apply-music-compact-v75.yml'
      - 'tesla-waze-preview/.v75-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v75-work
          fetch-depth: 0
      - name: Apply V75 patch
        run: python tesla-waze-preview/music-compact-header-v75-patch.py
      - name: Check JavaScript syntax
        run: node --check tesla-waze-preview/app.js
      - name: Verify exact compact layout invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('tesla-waze-preview/app.css').read_text()
          js=Path('tesla-waze-preview/app.js').read_text()
          required=[
            'MUSIC_COMPACT_HEADER_V75',
            'grid-template-columns:1fr!important',
            'grid-template-rows:repeat(3,44px)!important',
            '.music-card:has(#youtubeSync){display:none!important}',
            '#musicCompactBack{display:flex!important}'
          ]
          for x in required: assert x in css, x
          for x in ['Smart Music','Prepojiť / synchronizovať YouTube','Maximalizovať','Minimalizovať','Späť na plochu','MUSIC_COMPACT_HEADER_V74']:
            assert x in js, x
          print('V75 exact layout invariants OK')
          PY
      - name: Rebuild compressed assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,base64
          for name in ['app.js','app.css']:
              raw=Path('tesla-waze-preview/'+name).read_bytes()
              Path('tesla-waze-preview/'+name+'.gz.b64').write_text(base64.b64encode(gzip.compress(raw,mtime=0)).decode('ascii')+'\n')
          PY
      - name: Verify compressed assets exact
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,base64
          for name in ['app.js','app.css']:
              raw=Path('tesla-waze-preview/'+name).read_bytes()
              got=gzip.decompress(base64.b64decode(Path('tesla-waze-preview/'+name+'.gz.b64').read_text().strip()))
              assert raw==got, name
          print('gzip exact')
          PY
      - name: Commit runtime V75
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.css tesla-waze-preview/app.css.gz.b64 tesla-waze-preview/app.js.gz.b64
          git commit -m 'music: exact approved compact Smart Music layout V75'
          git push origin HEAD:tesla-waze-v75-work
