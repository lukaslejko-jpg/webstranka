name: Apply Tesla Music Offline V25 resolver fix

on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/apply-offline-v24-resolver-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_offline_v25.py
      - name: Verify
        run: |
          set -euo pipefail
          node --check tesla-music-v7-preview/offline-v20.js
          grep -q 'function requestIdentity' tesla-music-v7-preview/offline-v20.js
          grep -q 'function dashParts' tesla-music-v7-preview/offline-v20.js
          grep -q '__TESLA_OFFLINE_V25__' tesla-music-v7-preview/offline-v20.js
          grep -q 'const rq=requestIdentity' tesla-music-v7-preview/offline-v20.js
          ! grep -q 'twmusic-offline-queue' tesla-music-v7-preview/offline-v20.js
      - name: Commit resolver fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-music-v7-preview/offline-v20.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(tesla-music): resolve generic uploader and dashed titles offline'
          git push origin HEAD:tesla-music-v6-preview
