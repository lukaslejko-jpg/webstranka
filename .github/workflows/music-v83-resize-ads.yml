name: Smart Music V83 resize and ads
on:
  push:
    branches: [tesla-waze-v83-work-do]
    paths:
      - 'tesla-waze-preview/music-v83-resize-ads-patch.py'
      - '.github/workflows/music-v83-resize-ads.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v83-work-do
      - name: Apply V83 patch
        run: python tesla-waze-preview/music-v83-resize-ads-patch.py
      - name: Syntax check
        run: node --check tesla-waze-preview/app.js
      - name: Verify V83 invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('tesla-waze-preview/app.js').read_text()
          css=Path('tesla-waze-preview/app.css').read_text()
          assert 'MUSIC_V83_RESIZE_AND_ADS' in js
          assert 'MUSIC_V83_RESIZE_AND_ADS' in css
          assert "small=!musicWindowState().maximized" in js
          assert "miniHeight:Math.round(rect.height)" in js
          assert "ads.id='musicAds'" in js
          assert "switchYoutubeToFree(yt,true)" in js
          assert ".music-shell:not(.music-maximized) #musicAds{display:none!important}" in css
          PY
      - name: Rebuild runtime payloads
        run: |
          python - <<'PY'
          import gzip,base64,pathlib
          for name in ('app.js','app.css'):
              p=pathlib.Path('tesla-waze-preview')/name
              raw=p.read_bytes()
              out=p.with_name(name+'.gz.b64')
              out.write_text(base64.b64encode(gzip.compress(raw,mtime=0)).decode(),encoding='ascii')
              assert gzip.decompress(base64.b64decode(out.read_text()))==raw
          PY
      - name: Commit V83
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          git commit -m 'music: fix mini resize and restore ads button V83'
          git push origin HEAD:tesla-waze-v83-work-do
