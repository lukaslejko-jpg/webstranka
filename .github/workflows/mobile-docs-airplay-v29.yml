name: Tesla Music docs AirPlay V29

on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/mobile-docs-airplay-v29.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
          fetch-depth: 0
      - name: Update docs
        run: python3 scripts/update_docs_airplay_v29.py
      - name: Verify
        run: grep -q 'AirPlay / systémový výstup – V29' docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(tesla-music): document AirPlay V29'
          git push origin HEAD:tesla-music-v6-preview
