name: Tesla Music final preview and production

on:
  push:
    branches:
      - refactor/tesla-music-playback-core-20260923
    paths:
      - '.github/workflows/tesla-music-final-preview-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEAM_ID: team_dev6vKKH2V0qxtGe0uy6GpT6
      TEAM_SLUG: lukaslejko-9932s-projects
      PROJECT_ID: prj_3UUsvRZV5rzNI7Qdkt4LzBYWEPwe
      BASE_DPL: dpl_H1L29ngkfBrrntSX4d1needeTGnA
      BUILD: "154"
      PROD_ALIAS: tesla-waze-piped.vercel.app
    steps:
      - name: Checkout refactor
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: |
          npm install --global vercel@59.25.4
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Authenticate Vercel CLI
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG=/tmp/vercel-device-auth.log
          rm -f "$LOG"
          timeout 300 vercel login --github >"$LOG" 2>&1 &
          PID=$!
          CODE=""
          URL=""
          for _ in $(seq 1 60); do
            if grep -Eq 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" 2>/dev/null; then
              URL="$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" | tail -n1)"
              CODE="${URL##*user_code=}"
              break
            fi
            sleep 1
          done
          if [ -z "$CODE" ]; then
            cat "$LOG"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            echo "Vercel device code was not emitted"
            exit 1
          fi
          echo "::notice title=Vercel device code::$CODE"
          node - "$CODE" "$URL" <<'NODE' > /tmp/status.json
          const [code,url]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            state:'pending',
            context:'vercel-device-auth',
            description:'Vercel code: '+code,
            target_url:url
          }));
          NODE
          curl -fsS -X POST             -H "Authorization: Bearer $GH_STATUS_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             --data-binary @/tmp/status.json >/dev/null
          cat "$LOG"
          wait "$PID"

      - name: Verify identity
        run: vercel whoami

      - name: Clone exact verified Vercel source tree
        run: |
          set -euo pipefail
          rm -rf /tmp/exact-prod
          mkdir -p /tmp/exact-prod
          vercel api "/v6/deployments/$BASE_DPL/files?teamId=$TEAM_ID" > /tmp/tree.json
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          const tree=JSON.parse(fs.readFileSync('/tmp/tree.json','utf8'));
          const out='/tmp/exact-prod';
          let files=[];
          function walk(nodes,prefix=''){
            for(const n of nodes||[]){
              const p=prefix?prefix+'/'+n.name:n.name;
              if(n.type==='directory') walk(n.children,p);
              else if(n.type==='file') files.push({path:p,uid:n.uid});
            }
          }
          walk(Array.isArray(tree)?tree:tree.files||tree.children||[]);
          if(!files.length) throw new Error('No source files returned from verified deployment');
          for(const f of files){
            fs.mkdirSync(path.dirname(path.join(out,f.path)),{recursive:true});
            const endpoint='/v8/deployments/'+process.env.BASE_DPL+'/files/'+f.uid+'?teamId='+process.env.TEAM_ID;
            const raw=cp.execFileSync('vercel',['api',endpoint],{encoding:'utf8',maxBuffer:20*1024*1024});
            const data=JSON.parse(raw),b64=data.data??data.content??data;
            if(typeof b64!=='string')throw new Error('Unexpected payload for '+f.path);
            fs.writeFileSync(path.join(out,f.path),Buffer.from(b64,'base64'));
          }
          console.log('CLONED_FILES='+files.length);
          NODE
          test -f /tmp/exact-prod/src/index.html
          test -f /tmp/exact-prod/src/vercel.json

      - name: Overlay only tested refactor files
        run: |
          set -euo pipefail
          SRC=/tmp/exact-prod/src
          for f in             app-v7.js             mobile-controls-v40.js             rescue-v135.js             desktop-silence-v63.js             mobile-v128-music-logic.js             mode-v9.js             desktop-v97-youtube-search.js             member-v50-foryou.js             member-v49-search-layout.js             mobile-v106-player-parity.js             member-v47-core.js             member-v47-background.js             vercel.json
          do
            cp "tesla-music-production/$f" "$SRC/$f"
          done

      - name: Normalize desktop route without changing production build model
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='/tmp/exact-prod/src/vercel.json';
          const v=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!fs.existsSync('/tmp/exact-prod/src/package.json')){
            delete v.buildCommand;
            delete v.outputDirectory;
            delete v.installCommand;
          }
          v.redirects=Array.isArray(v.redirects)?v.redirects:[];
          v.redirects=v.redirects.filter(r=>r.source!=='/desktop/');
          v.rewrites=Array.isArray(v.rewrites)?v.rewrites:[];
          v.rewrites=v.rewrites.filter(r=>r.source!=='/desktop'&&r.source!=='/desktop/');
          v.rewrites.push({source:'/desktop',destination:'/index.html'},{source:'/desktop/',destination:'/index.html'});
          fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          NODE

      - name: Normalize one build version
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const build=process.env.BUILD;
          for(const p of ['/tmp/exact-prod/src/index.html','/tmp/exact-prod/src/upstream/piped/index.html']){
            if(!fs.existsSync(p))continue;
            let s=fs.readFileSync(p,'utf8');
            s=s.replace(/(<meta name="tesla-music-build" content=")[^"]+(")/g,'$1'+build+'$2');
            s=s.replace(/((?:src|href)="\/[^"]+?)(?:\?v=\d+)?(")/g,(m,a,b)=>{
              if(/youtube\.com/.test(a)||/manifest\.webmanifest/.test(a))return m;
              return a+'?v='+build+b;
            });
            fs.writeFileSync(p,s);
          }
          NODE

      - name: Validate source invariants
        run: |
          set -euo pipefail
          SRC=/tmp/exact-prod/src
          node --check "$SRC/app-v7.js"
          node --check "$SRC/mobile-controls-v40.js"
          node --check "$SRC/mobile-v128-music-logic.js"
          node --check "$SRC/desktop-v97-youtube-search.js"
          node --check "$SRC/rescue-v135.js"
          grep -q 'tesla-music-build" content="154' "$SRC/index.html"
          ! grep -Eq '\?v=(128|153)' "$SRC/index.html"
          grep -Fq "if(!/^\/(?:index\.html)?$/.test(location.pathname))return" "$SRC/mobile-v128-music-logic.js"
          grep -Fq "if(!/^\/desktop\/?$/.test(location.pathname))return" "$SRC/desktop-v97-youtube-search.js"
          ! grep -Eq 'new[[:space:]]+Audio|silence\.wav' "$SRC/desktop-silence-v63.js"
          ! grep -Eq 'setInterval[[:space:]]*\(' "$SRC/rescue-v135.js"
          node <<'NODE'
          const fs=require('fs');
          const p='/tmp/exact-prod/src/vercel.json';
          const v=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!fs.existsSync('/tmp/exact-prod/src/package.json')&&(v.buildCommand||v.outputDirectory)) throw new Error('static deploy model not normalized');
          if(!(v.rewrites||[]).some(r=>r.source==='/desktop'&&r.destination==='/index.html')) throw new Error('desktop rewrite missing');
          if(!(v.rewrites||[]).some(r=>r.source==='/desktop/'&&r.destination==='/index.html')) throw new Error('desktop slash rewrite missing');
          NODE

      - name: Link exact project
        working-directory: /tmp/exact-prod/src
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > .vercel/project.json

      - name: Deploy preview
        working-directory: /tmp/exact-prod/src
        run: |
          set -euo pipefail
          URL="$(vercel deploy --archive=tgz --scope "$TEAM_SLUG")"
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "PREVIEW=$URL"

      - name: Verify preview files and routes
        working-directory: /tmp/exact-prod/src
        run: |
          set -euo pipefail
          vercel inspect "$PREVIEW_URL" --scope "$TEAM_SLUG"
          vercel curl "/?mobile=1&device=mobile" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/mobile-root.html
          vercel curl "/mobile-controls-v40.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/playback.js
          test "$(wc -c < /tmp/mobile-root.html)" -gt 5000
          grep -q 'tesla-music-build" content="154' /tmp/mobile-root.html
          grep -Fq 'single shared playback controller' /tmp/playback.js
          cmp -s mobile-controls-v40.js /tmp/playback.js
          STATUS="$(vercel curl "/api/youtube-search?q=Kali" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" -I | head -n 1)"
          echo "$STATUS"

      - name: Preview authenticated acceptance
        working-directory: /tmp/exact-prod/src
        run: |
          set -euo pipefail
          vercel curl "/?mobile=1&device=mobile" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/preview-mobile.html
          vercel curl "/mobile-controls-v40.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/preview-playback.js
          vercel curl "/mobile-v128-music-logic.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/preview-mobile-logic.js
          vercel curl "/desktop-v97-youtube-search.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/preview-desktop-logic.js
          vercel curl "/member-v49-search-layout.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/preview-search-layout.js
          vercel curl "/rescue-v135.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/preview-rescue.js
          vercel curl "/api/youtube-search?q=Kali" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/preview-search.json
          test "$(wc -c < /tmp/preview-mobile.html)" -gt 5000
          grep -q 'tesla-music-build" content="154' /tmp/preview-mobile.html
          cmp -s mobile-controls-v40.js /tmp/preview-playback.js
          cmp -s mobile-v128-music-logic.js /tmp/preview-mobile-logic.js
          cmp -s desktop-v97-youtube-search.js /tmp/preview-desktop-logic.js
          cmp -s member-v49-search-layout.js /tmp/preview-search-layout.js
          cmp -s rescue-v135.js /tmp/preview-rescue.js
          node -e "const d=require('/tmp/preview-search.json'); if(!Array.isArray(d.items)||!d.items.length)process.exit(1)"
          echo "PREVIEW_AUTHENTICATED_ACCEPTANCE_OK"

      - name: Point production alias to exact verified preview
        run: |
          set -euo pipefail
          vercel alias set "$PREVIEW_URL" "$PROD_ALIAS" --scope "$TEAM_SLUG"
          echo "PRODUCTION_ALIAS_SET_OK"

      - name: Production smoke
        run: |
          set -euo pipefail
          sleep 5
          vercel inspect "https://$PROD_ALIAS" --scope "$TEAM_SLUG"
          vercel curl "/?mobile=1&device=mobile" --deployment "https://$PROD_ALIAS" --scope "$TEAM_SLUG" > /tmp/prod-mobile.html
          vercel curl "/mobile-controls-v40.js" --deployment "https://$PROD_ALIAS" --scope "$TEAM_SLUG" > /tmp/prod-playback.js
          grep -q 'tesla-music-build" content="154' /tmp/prod-mobile.html
          grep -Fq 'single shared playback controller' /tmp/prod-playback.js
          cmp -s /tmp/exact-prod/src/mobile-controls-v40.js /tmp/prod-playback.js
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox']});
            for(const path of ['/?mobile=1&device=mobile','/desktop','/desktop/']){
              const ctx=await browser.newContext({serviceWorkers:'block',viewport:{width:1280,height:800}});
              const p=await ctx.newPage(),errors=[];
              p.on('pageerror',e=>errors.push(e.message));
              await p.goto('https://tesla-waze-piped.vercel.app'+path,{waitUntil:'domcontentloaded'});
              await p.waitForSelector('#q',{timeout:15000});
              if(path.includes('desktop')) assert.equal(new URL(p.url()).pathname,'/desktop');
              assert.equal(errors.length,0,errors.join('; '));
              await ctx.close();
            }
            await browser.close();
            console.log('PRODUCTION_BROWSER_SMOKE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "PRODUCTION_SMOKE_OK"
