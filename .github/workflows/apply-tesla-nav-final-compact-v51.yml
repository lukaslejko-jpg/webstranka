name: Apply Tesla nav final compact V51

on:
  push:
    branches: [tesla-waze-preview-v1]
    paths:
      - 'tesla-waze-preview/navigation-final-compact-patch.py'
      - '.github/workflows/apply-tesla-nav-final-compact-v51.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply final compact navigation CSS
        run: python3 tesla-waze-preview/navigation-final-compact-patch.py
      - name: Verify final behavior
        run: |
          set -euo pipefail
          grep -q 'TESLA_NAV_FINAL_COMPACT_V51' tesla-waze-preview/app.css
          grep -q 'height:180px!important' tesla-waze-preview/app.css
          grep -q 'body:not(.tesla-navigating) #alertBox' tesla-waze-preview/app.css
      - name: Rebuild CSS asset
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          gzip -n -c app.css > app.css.gz
          gzip -t app.css.gz
          base64 -w 0 app.css.gz > app.css.gz.b64
          rm app.css.gz
      - name: Commit V51
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.css tesla-waze-preview/app.css.gz.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'nav: hide idle HUD and set trip panel to 180px'
          git push origin HEAD:tesla-waze-preview-v1
