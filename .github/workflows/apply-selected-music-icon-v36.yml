name: Apply selected Tesla Music icon v36
on:
  push:
    branches: [tesla-music-v6-preview]
    paths: ['.github/workflows/apply-selected-music-icon-v36.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
      - name: Apply selected icon
        shell: python
        run: |
          from pathlib import Path
          p=Path('tesla-music-v7-preview/account-v8.js')
          s=p.read_text(encoding='utf-8')
          start='/* TESLA_MUSIC_SELECTED_ICON_V36 */'
          # Remove prior dynamic favicon block if present.
          import re
          s=re.sub(r'/\* TESLA_MUSIC_FAVICON_V34 \*/\n\(\(\)=>\{try\{.*?\}\}\)\(\);\n?', '', s, count=1, flags=re.S)
          if start not in s:
              b64=''
              icon="data:image/jpeg;base64,"+b64
              inject=(start+"\n(()=>{try{document.querySelectorAll('link[rel*=\\\"icon\\\"]').forEach(x=>x.remove());const l=document.createElement('link');l.rel='icon';l.type='image/jpeg';l.href='"+icon+"';document.head.appendChild(l)}catch{}})();\n")
              s=inject+s
          p.write_text(s,encoding='utf-8')
      - name: Verify search and icon guard
        run: |
          grep -q 'TESLA_MUSIC_SELECTED_ICON_V36' tesla-music-v7-preview/account-v8.js
          grep -q '/api/youtube-search' tesla-music-v7-preview/app-v7.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tesla-music-v7-preview/account-v8.js
          git commit -m 'feat(tesla-music): use selected vinyl music icon' || exit 0
          git push origin HEAD:tesla-music-v6-preview