name: Deploy isolated Music TV VIDAA

on:
  push:
    branches: [music-tv-vidaa]
    paths:
      - 'music-tv-vidaa/**'
      - '.github/workflows/deploy-music-tv-vidaa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEAM_SLUG: lukaslejko-9932s-projects
      TV_PROJECT: music-tv-vidaa
      SOURCE_DIR: music-tv-vidaa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@59.25.4

      - name: Authenticate Vercel CLI
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG=/tmp/vercel-device-auth.log
          rm -f "$LOG"
          timeout 300 vercel login --github >"$LOG" 2>&1 &
          PID=$!
          CODE=""
          URL=""
          for _ in $(seq 1 60); do
            if grep -Eq 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" 2>/dev/null; then
              URL="$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" | tail -n1)"
              CODE="${URL##*user_code=}"
              break
            fi
            sleep 1
          done
          test -n "$CODE"
          echo "::notice title=Music TV Vercel device code::$CODE"
          node - "$CODE" "$URL" <<'NODE' >/tmp/status.json
          const [code,url]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({state:'pending',context:'music-tv-vidaa-auth',description:'Vercel code: '+code,target_url:url}));
          NODE
          curl -fsS -X POST             -H "Authorization: Bearer $GH_STATUS_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             --data-binary @/tmp/status.json >/dev/null
          cat "$LOG"
          wait "$PID"

      - name: Ensure isolated Vercel project exists
        run: |
          set -euo pipefail
          vercel project inspect "$TV_PROJECT" --scope "$TEAM_SLUG" >/dev/null 2>&1 ||             vercel project add "$TV_PROJECT" --scope "$TEAM_SLUG"

      - name: Link only TV directory
        working-directory: music-tv-vidaa
        run: vercel link --yes --project "$TV_PROJECT" --scope "$TEAM_SLUG"

      - name: Deploy Music TV
        id: deploy
        working-directory: music-tv-vidaa
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prod --yes --scope "$TEAM_SLUG")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "MUSIC_TV_URL=$URL"

      - name: Verify TV is isolated and mirrors Music
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          vercel inspect "$URL" --scope "$TEAM_SLUG"
          HTML="$(curl -fsSL "$URL/")"
          echo "$HTML" | grep -Fq '<title>Music</title>'
          echo "$HTML" | grep -Fq 'tesla-music-build'
          echo "MUSIC_TV_DEPLOY_OK=$URL"
