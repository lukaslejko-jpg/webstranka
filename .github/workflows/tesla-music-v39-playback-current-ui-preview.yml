name: Tesla Music V39 playback + current UI preview

on:
  push:
    branches:
      - rebuild/tesla-music-clean-stable-20260925
    paths:
      - '.github/workflows/tesla-music-v39-playback-current-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# Return point before visibility repair: 0cbb0e4b8a2d401efe8409527e491a76909e26f0.
# Production alias observed as dpl_5gBLzGmWZZ3m9bzDgvzQhAGQBwfC. Do not promote or alias.
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEAM_ID: team_dev6vKKH2V0qxtGe0uy6GpT6
      TEAM_SLUG: lukaslejko-9932s-projects
      PROJECT_ID: prj_3UUsvRZV5rzNI7Qdkt4LzBYWEPwe
      GOLDEN_DPL: dpl_H1L29ngkfBrrntSX4d1needeTGnA
      V39_SHA: 358ad048c356979f786c0a85dc704fa1b61d9c7d
      BUILD: "158"
    steps:
      - name: Checkout current UI branch
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: |
          npm install --global vercel@59.25.4
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Authenticate Vercel CLI
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG=/tmp/vercel-device-auth.log
          rm -f "$LOG"
          timeout 300 vercel login --github >"$LOG" 2>&1 &
          PID=$!
          CODE=""
          URL=""
          for _ in $(seq 1 60); do
            if grep -Eq 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" 2>/dev/null; then
              URL="$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" | tail -n1)"
              CODE="${URL##*user_code=}"
              break
            fi
            sleep 1
          done
          test -n "$CODE"
          echo "::notice title=Vercel device code::$CODE"
          node - "$CODE" "$URL" <<'NODE' >/tmp/status.json
          const [code,url]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({state:'pending',context:'tesla-music-v39-current-ui-auth',description:'Vercel code: '+code,target_url:url}));
          NODE
          curl -fsS -X POST             -H "Authorization: Bearer $GH_STATUS_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             --data-binary @/tmp/status.json >/dev/null
          cat "$LOG"
          wait "$PID"

      - name: Clone golden production shell
        run: |
          set -euo pipefail
          rm -rf /tmp/candidate
          mkdir -p /tmp/candidate
          vercel api "/v6/deployments/$GOLDEN_DPL/files?teamId=$TEAM_ID" > /tmp/tree.json
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          const tree=JSON.parse(fs.readFileSync('/tmp/tree.json','utf8'));
          const out='/tmp/candidate';
          let files=[];
          function walk(nodes,prefix=''){for(const n of nodes||[]){const p=prefix?prefix+'/'+n.name:n.name;if(n.type==='directory')walk(n.children,p);else if(n.type==='file')files.push({path:p,uid:n.uid});}}
          walk(Array.isArray(tree)?tree:tree.files||tree.children||[]);
          if(!files.length) throw new Error('No golden files');
          for(const f of files){
            fs.mkdirSync(path.dirname(path.join(out,f.path)),{recursive:true});
            const raw=cp.execFileSync('vercel',['api','/v8/deployments/'+process.env.GOLDEN_DPL+'/files/'+f.uid+'?teamId='+process.env.TEAM_ID],{encoding:'utf8',maxBuffer:20*1024*1024});
            const d=JSON.parse(raw),b64=d.data??d.content??d;
            fs.writeFileSync(path.join(out,f.path),Buffer.from(b64,'base64'));
          }
          NODE
          test -f /tmp/candidate/src/index.html

      - name: Restore exact verified V39 playback core
        run: |
          set -euo pipefail
          SRC=/tmp/candidate/src
          BASE="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$V39_SHA/tesla-music-v7-preview"
          curl -fsSL "$BASE/app-v7.js" -o "$SRC/app-v7.js"
          curl -fsSL "$BASE/mode-v9.js" -o "$SRC/mode-v9.js"
          node --check "$SRC/app-v7.js"
          node --check "$SRC/mode-v9.js"
          grep -Fq "player.loadVideoById(t.id)" "$SRC/app-v7.js"
          grep -Fq "if(settings.auto)next(false)" "$SRC/app-v7.js"

      - name: Carry forward current non-playback UI
        run: |
          set -euo pipefail
          SRC=/tmp/candidate/src
          for f in             member-v47-core.js             member-v47-background.js             member-v49-search-layout.js             member-v50-foryou.js             mobile-v106-player-parity.js             mobile-v128-music-logic.js             desktop-v97-youtube-search.js
          do
            cp "tesla-music-production/$f" "$SRC/$f"
          done

      - name: Remove V40 playback interception and normalize routes
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const root='/tmp/candidate/src';
          for(const p of [root+'/index.html',root+'/upstream/piped/index.html']){
            if(!fs.existsSync(p))continue;
            let s=fs.readFileSync(p,'utf8');
            s=s.replace(/<script[^>]+src="\/mobile-controls-v40\.js[^"]*"[^>]*><\/script>/g,'');
            s=s.replace(/(<meta name="tesla-music-build" content=")[^"]+(")/g,'$1'+process.env.BUILD+'$2');
            s=s.replace(/((?:src|href)="\/[^"]+?)(?:\?v=\d+)?(")/g,(m,a,b)=>/youtube\.com|manifest\.webmanifest/.test(a)?m:a+'?v='+process.env.BUILD+b);
            fs.writeFileSync(p,s);
          }
          const vp=root+'/vercel.json',v=JSON.parse(fs.readFileSync(vp,'utf8'));
          if(!fs.existsSync(root+'/package.json')){delete v.buildCommand;delete v.outputDirectory;delete v.installCommand;}
          v.rewrites=Array.isArray(v.rewrites)?v.rewrites:[];
          v.rewrites=v.rewrites.filter(r=>!['/api/music','/desktop','/desktop/'].includes(r.source));
          v.rewrites.unshift({source:'/api/music',destination:'https://europrojekty-app.vercel.app/api/music'});
          v.rewrites.push({source:'/desktop',destination:'/index.html'},{source:'/desktop/',destination:'/index.html'});
          v.redirects=Array.isArray(v.redirects)?v.redirects.filter(r=>r.source!=='/desktop/'):[];
          fs.writeFileSync(vp,JSON.stringify(v,null,2)+'\n');
          NODE
          ! grep -q "mobile-controls-v40.js" /tmp/candidate/src/index.html

      - name: Keep minimized iPhone player rendered
        run: |
          set -euo pipefail
          cat >> /tmp/candidate/src/mode-v9.css <<'CSS'

          /* iPhone live minimized player: do not use display:none for YouTube iframe. */
          #playerWindow.minimized{
            display:block!important;
            position:fixed!important;
            left:1px!important;
            top:auto!important;
            right:auto!important;
            bottom:1px!important;
            width:2px!important;
            height:2px!important;
            min-width:2px!important;
            min-height:2px!important;
            max-width:2px!important;
            max-height:2px!important;
            opacity:.01!important;
            overflow:hidden!important;
            pointer-events:none!important;
            border:0!important;
            box-shadow:none!important;
            z-index:1!important
          }
          #playerWindow.minimized .phead,
          #playerWindow.minimized .nowrow,
          #playerWindow.minimized .seek,
          #playerWindow.minimized .controls,
          #playerWindow.minimized .stats,
          #playerWindow.minimized .status,
          #playerWindow.minimized .mini-recommend,
          #playerWindow.minimized .resize,
          #playerWindow.minimized .mini-resize-zone,
          #playerWindow.minimized .mini-resize-corner{display:none!important}
          #playerWindow.minimized .player-body,
          #playerWindow.minimized .video,
          #playerWindow.minimized #yt,
          #playerWindow.minimized iframe{
            display:block!important;
            position:absolute!important;
            inset:0!important;
            width:2px!important;
            height:2px!important;
            min-width:2px!important;
            min-height:2px!important;
            opacity:.01!important;
            visibility:visible!important;
            pointer-events:none!important;
            padding:0!important;
            margin:0!important
          }
          CSS
          grep -Fq "#playerWindow.minimized{" /tmp/candidate/src/mode-v9.css

      - name: Verify current overlays do not own playback
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=[
            '/tmp/candidate/src/member-v47-core.js',
            '/tmp/candidate/src/member-v47-background.js',
            '/tmp/candidate/src/member-v49-search-layout.js',
            '/tmp/candidate/src/member-v50-foryou.js',
            '/tmp/candidate/src/mobile-v106-player-parity.js',
            '/tmp/candidate/src/mobile-v128-music-logic.js',
            '/tmp/candidate/src/desktop-v97-youtube-search.js'
          ];
          for(const f of files){
            const s=fs.readFileSync(f,'utf8');
            if(/(?:^|[;\n])\s*(?:window\.)?(?:playTrack|next|prev)\s*=/.test(s))throw new Error('overlay owns playback '+f);
            if(/setActionHandler\(['"](?:nexttrack|previoustrack)/.test(s))throw new Error('overlay owns MediaSession '+f);
          }
          NODE

      - name: Diagnose and repair exact visibility writer; verify DOM and mock API
        run: |
          set -euo pipefail
          node --check scripts/tesla-music-v39-render-regression.cjs
          node scripts/tesla-music-v39-render-regression.cjs /tmp/candidate/src

      - name: Save visibility regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tesla-music-render-${{ github.run_id }}
          path: /tmp/tesla-music-render-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Link project
        working-directory: /tmp/candidate/src
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > .vercel/project.json

      - name: Deploy preview only
        working-directory: /tmp/candidate/src
        run: |
          URL="$(vercel deploy --archive=tgz --scope "$TEAM_SLUG")"
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"

      - name: Verify deployed preview
        working-directory: /tmp/candidate/src
        run: |
          set -euo pipefail
          vercel curl "/?mobile=1&device=mobile" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/root.html
          vercel curl "/app-v7.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/app.js
          vercel curl "/mode-v9.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/mode.js
          vercel curl "/rescue-v135.js" --deployment "$PREVIEW_URL" --scope "$TEAM_SLUG" > /tmp/rescue.js
          grep -Fq "tesla-music-build\" content=\"$BUILD" /tmp/root.html
          ! grep -q "mobile-controls-v40.js" /tmp/root.html
          cmp -s app-v7.js /tmp/app.js
          cmp -s mode-v9.js /tmp/mode.js
          cmp -s rescue-v135.js /tmp/rescue.js
          echo "DEPLOYED_V39_AND_VISIBILITY_PATCH_EXACT_OK"

      - name: Publish preview URL
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          node - "$PREVIEW_URL" <<'NODE' >/tmp/status.json
          const url=process.argv[2];
          process.stdout.write(JSON.stringify({state:'success',context:'tesla-music-v39-current-ui-preview',description:'Render and mock API checks passed; real iPhone audio test required',target_url:url}));
          NODE
          curl -fsS -X POST             -H "Authorization: Bearer $GH_STATUS_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             --data-binary @/tmp/status.json >/dev/null
