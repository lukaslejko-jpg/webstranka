name: Emergency recover Tesla Waze pinned frame v108

on:
  push:
    branches:
      - tesla-waze-emergency-direct
    paths:
      - 'tesla-waze-preview/emergency-stay-pinned-v108.py'
      - '.github/workflows/emergency-stay-pinned-v108.yml'
      - 'tesla-waze-emergency-v108-trigger.txt'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout emergency tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to production branch and apply narrow recovery
        shell: bash
        run: |
          set -euo pipefail
          cp tesla-waze-preview/emergency-stay-pinned-v108.py /tmp/emergency-stay-pinned-v108.py
          git fetch origin tesla-waze-preview-v1
          git checkout -B tesla-waze-preview-v1 origin/tesla-waze-preview-v1
          python3 /tmp/emergency-stay-pinned-v108.py
          node --check tesla-waze-preview/app.js
          grep -q 'RAWGITHACK_PINNED_STAY_V108' tesla-waze-preview/app.js
          ! grep -q "location.replace('https://raw.githack.com'+V98_BRANCH_PATH" tesla-waze-preview/app.js

      - name: Rebuild exact runtime JS asset
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          gzip -n -c app.js > app.js.gz
          gzip -t app.js.gz
          base64 -w 0 app.js.gz > app.js.gz.b64
          base64 -d app.js.gz.b64 > verify.gz
          gzip -t verify.gz
          cmp <(gzip -dc verify.gz) app.js
          rm -f app.js.gz verify.gz

      - name: Commit recovery without triggering legacy patch workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          if git diff --cached --quiet; then echo 'Recovery already present.'; exit 0; fi
          git commit -m 'fix: keep Tesla iframe on pinned live3 v108 [skip ci]'
          git push origin HEAD:tesla-waze-preview-v1
