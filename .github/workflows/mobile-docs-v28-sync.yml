name: Tesla Music mobile docs V28 sync

on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/mobile-docs-v28-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
      - name: Sync documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md')
          s=p.read_text()
          s=s.replace('## 5. Offline resolver – V26','## 5. Offline resolver – V28')
          s=s.replace('`__TESLA_OFFLINE_V26__`','`__TESLA_OFFLINE_V28__`')
          s=s.replace('1. Jamendo\n2. Openverse Audio\n3. Internet Archive\n4. Wikimedia Commons\n5. MusicBrainz ako metadata/normalizácia identity skladby','1. Jamendo\n2. ccMixter\n3. Openverse Audio\n4. Internet Archive – vrátane priorizácie Netlabels a Open Source Audio\n5. Wikimedia Commons\n6. MusicBrainz ako metadata/normalizácia identity skladby')
          s=s.replace('## 7. Wikimedia Commons – V26 exact fallback','## 7. Wikimedia Commons – exact fallback (od V26, aktívny vo V28)')
          s=s.replace('Aktuálny mobilný Offline V26','Aktuálny mobilný Offline V28')
          s=s.replace('aktuálny mobilný Offline V26','aktuálny mobilný Offline V28')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          set -euo pipefail
          grep -q '## 5. Offline resolver – V28' docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
          grep -q '__TESLA_OFFLINE_V28__' docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
          grep -q 'ccMixter' docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(tesla-music): make V28 canonical'
          git push origin HEAD:tesla-music-v6-preview
