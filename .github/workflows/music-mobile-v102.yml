name: Music mobile V102
on:
  push:
    branches: [tesla-waze-v102-work]
    paths: ['.github/workflows/music-mobile-v102.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v102-work
          fetch-depth: 0
      - name: Patch mobile CSS only
        shell: bash
        run: |
          cat >> tesla-waze-preview/app.css <<'EOF'

/* MUSIC_MOBILE_MAX_V102 */
@media(max-width:900px){
  .music-shell.music-maximized{width:100vw!important;max-width:100vw!important;height:100dvh!important;border-left:0!important}
  .music-shell.music-maximized .music-head{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;padding:8px 10px!important;overflow:visible!important}
  .music-shell.music-maximized .music-head-brand{display:none!important}
  .music-shell.music-maximized #musicHeaderSearch{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;width:100%!important;min-width:0!important;margin:0!important;gap:6px!important;order:1!important;z-index:7015!important}
  .music-shell.music-maximized #musicHeaderSearch .music-header-back{grid-column:1/-1!important;width:100%!important}
  .music-shell.music-maximized .music-header-search-field{min-width:0!important;width:100%!important}
  .music-shell.music-maximized .music-header-search-field input{display:block!important;width:100%!important;min-width:0!important;height:42px!important;min-height:42px!important}
  .music-shell.music-maximized .music-header-search-btn{display:block!important;height:42px!important;min-height:42px!important;min-width:72px!important;padding:0 10px!important}
  .music-shell.music-maximized .music-head-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;width:100%!important;order:2!important}
  .music-shell.music-maximized .music-head-actions .btn{width:100%!important;min-width:0!important;max-width:none!important;height:42px!important;min-height:42px!important;padding:0 6px!important;font-size:12px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
  .music-shell.music-maximized .music-head>.spacer,.music-shell.music-maximized .music-head-sync{display:none!important}
  .music-shell.music-maximized .music-body{padding:10px!important;gap:10px!important}
  .music-shell.music-maximized .music-player{padding:10px!important}
  .music-shell.music-maximized .music-player .yt-player,.music-shell.music-maximized .music-player .yt-player iframe{width:100%!important;max-height:36dvh!important;aspect-ratio:16/9!important;object-fit:contain!important}
  .music-shell.music-maximized.music-video-open .music-player .yt-player{left:8px!important;top:112px!important;width:calc(100vw - 16px)!important;max-height:calc(100dvh - 190px)!important}
  .music-shell.music-maximized .music-controls{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important}
}
EOF
          gzip -n -9 -c tesla-waze-preview/app.css | base64 -w0 > tesla-waze-preview/app.css.gz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.css tesla-waze-preview/app.css.gz.b64
          git commit -m 'music: fix mobile maximized layout V102 [skip ci]'
          git push origin HEAD:tesla-waze-v102-work
# trigger-v102
