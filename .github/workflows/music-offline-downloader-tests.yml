name: music-offline-downloader-tests

on:
  pull_request:
    paths:
      - "music-offline-downloader/**"
      - ".github/workflows/music-offline-downloader-tests.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-offline-downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
