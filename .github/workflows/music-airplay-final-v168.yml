name: Build final AirPlay test from approved Music v168
on:
  push:
    branches: [fix/music-airplay-final-from-approved-v168-20260927]
    paths: ['airplay-final/**','.github/workflows/music-airplay-final-v168.yml']
permissions: {contents: read, statuses: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEAM_ID: team_dev6vKKH2V0qxtGe0uy6GpT6
      TEAM_SLUG: lukaslejko-9932s-projects
      BASE_DPL: dpl_Cy4GCgxJcFivhpkKj88oMQUEHmEr
      APPROVED_HOST: https://music-qr-test.vercel.app
      TEST_PROJECT: music-airplay-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm i -g vercel@59.25.4
      - name: Auth
        env: {GH_STATUS_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          LOG=/tmp/a; timeout 300 vercel login --github >"$LOG" 2>&1 & PID=$!
          for _ in $(seq 1 60); do URL="$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" 2>/dev/null|tail -1||true)"; [ -n "$URL" ]&&break;sleep 1;done
          test -n "$URL"; CODE="${URL##*user_code=}"
          printf '{"state":"pending","context":"music-airplay-final-auth","description":"Vercel code: %s","target_url":"%s"}' "$CODE" "$URL" >/tmp/s
          curl -fsS -X POST -H "Authorization: Bearer $GH_STATUS_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/s >/dev/null
          wait "$PID"
      - name: Clone exact approved public v168 assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/music
          curl -fsS "$APPROVED_HOST/" -o /tmp/music/index.html
          grep -Fq 'content="168-test"' /tmp/music/index.html
          python3 - <<'PY'
          import re,urllib.request
          from pathlib import Path
          h=Path('/tmp/music/index.html').read_text()
          urls=set(re.findall(r'(?:src|href)="(/[^"]+)"',h))
          for u in sorted(urls):
              p=u.split('?')[0]
              if p=='/' or p.startswith('//'): continue
              out=Path('/tmp/music'+p); out.parent.mkdir(parents=True,exist_ok=True)
              try: out.write_bytes(urllib.request.urlopen('https://music-qr-test.vercel.app'+u,timeout=20).read())
              except Exception as e: print('SKIP',u,e)
          PY
          test -f /tmp/music/mobile-v128-music-logic.js
          test -f /tmp/music/app-v7.js
          test -f /tmp/music/rescue-v135.js
          curl -fsS "$APPROVED_HOST/vercel.json" -o /tmp/music/vercel.json || printf '{}' >/tmp/music/vercel.json
      - name: Patch only playback and bypass gate on test
        run: |
          set -euo pipefail
          cd /tmp/music
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-v7.js');s=p.read_text()
          old="player.loadVideoById(t.id);now();discover(t);media();window.dispatchEvent(new CustomEvent('tesla-music-trackchange',{detail:t}))"
          new="const ids=queue.map(x=>String(x.id||x.youtubeId||'')).filter(x=>/^[A-Za-z0-9_-]{11}$/.test(x));const pi=Math.max(0,queue.findIndex(x=>key(x)===key(t)));if(ids.length>1&&typeof player.loadPlaylist==='function')player.loadPlaylist({playlist:ids,index:pi,startSeconds:0,suggestedQuality:'default'});else player.loadVideoById(t.id);now();discover(t);media();window.dispatchEvent(new CustomEvent('tesla-music-trackchange',{detail:t}))"
          assert old in s
          s=s.replace(old,new,1)
          old2="function next(man=true){if(!queue.length)return;if(current&&man&&started&&Date.now()-started<15000)ev('skip',current);"
          # Keep the app's original next() state machine. Native playlist is only the transport layer.
          assert old2 in s
          old3="onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){if(current)ev('complete',current);if(settings.auto)next(false)}media()}"
          # AUTO must not depend on the persisted setting in the isolated test.
          # Manual Next is proven to work; invoke the same path on ENDED.
          new3="onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){if(current)ev('complete',current);setTimeout(()=>{try{next(false)}catch{}},80)}media()}"
          assert old3 in s
          s=s.replace(old3,new3,1)
          p.write_text(s)
          h=Path('index.html');x=h.read_text();x=x.replace('</body>','<script src="/airplay-test-bypass.js?v=final2"></script></body>');h.write_text(x)
          Path('airplay-test-bypass.js').write_text("(()=>{const c=()=>document.getElementById('musicGate')?.remove();c();new MutationObserver(c).observe(document.documentElement,{childList:true,subtree:true})})();")
          PY
          node --check app-v7.js
          grep -Fq 'player.loadPlaylist' app-v7.js
          grep -Fq 'setTimeout(()=>{try{next(false)}catch{}},80)' app-v7.js
          ! grep -Fq 'typeof player.nextVideo' app-v7.js
          mkdir -p api
          cat > api/music.js <<'JS'
          export default async function h(req,res){try{const H={'content-type':req.headers['content-type']||'application/json'};if(req.headers.authorization)H.authorization=req.headers.authorization;const r=await fetch('https://tesla-waze-piped.vercel.app/api/music',{method:req.method,headers:H,body:['GET','HEAD'].includes(req.method)?undefined:JSON.stringify(req.body??{})});res.status(r.status).send(await r.text())}catch(e){res.status(502).json({error:String(e)})}}
          JS
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('vercel.json');d=json.loads(p.read_text()) if p.exists() else {};r=d.get('rewrites',[]);r=[x for x in r if x.get('source')!='/api/youtube-search'];r.insert(0,{'source':'/api/youtube-search','destination':'https://tesla-waze-piped.vercel.app/api/youtube-search'});d['rewrites']=r;p.write_text(json.dumps(d,separators=(',',':')))
          PY
      - name: Deploy isolated public test
        working-directory: /tmp/music
        run: |
          set -euo pipefail
          vercel project add "$TEST_PROJECT" --scope "$TEAM_SLUG" 2>/dev/null||true
          vercel project protection disable "$TEST_PROJECT" --sso --scope "$TEAM_SLUG"||true
          vercel link --yes --project "$TEST_PROJECT" --scope "$TEAM_SLUG"
          URL="$(vercel deploy --prod --archive=tgz --scope "$TEAM_SLUG")"; echo "URL=$URL" >> "$GITHUB_ENV"
      - name: Hard verify before user sees link
        run: |
          set -euo pipefail
          H=https://music-airplay-test.vercel.app
          curl -fsS "$H/?final=1" >/tmp/h
          grep -Fq 'content="168-test"' /tmp/h
          curl -fsS "$H/app-v7.js?v=158" >/tmp/c
          grep -Fq 'player.loadPlaylist' /tmp/c
          grep -Fq 'setTimeout(()=>{try{next(false)}catch{}},80)' /tmp/c
          ! grep -Fq 'typeof player.nextVideo' /tmp/c
          curl -fsS "$H/api/youtube-search?q=%C4%BEudovky" >/tmp/s
          grep -q 'youtubeId' /tmp/s
          S="$(curl -sS -o /tmp/p -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"action":"__probe__"}' "$H/api/music")"
          test "$S" != 404; test "$S" != 502
          echo FINAL_AIRPLAY_TEST_READY
