name: Apply TM-Y navigation core V67

on:
  push:
    branches: [tesla-waze-preview-v1]
    paths:
      - 'tesla-waze-preview/navigation-tmy-core-v67-patch.py'
      - '.github/workflows/apply-nav-tmy-core-v67.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply V67
        run: python tesla-waze-preview/navigation-tmy-core-v67-patch.py
      - name: Verify JS syntax and markers
        run: |
          node --check tesla-waze-preview/app.js
          grep -q 'NAV_TMY_CORE_CONSOLIDATED_V67' tesla-waze-preview/app.js
          grep -q 'TMY_FULL_NAV_V22' tesla-waze-preview/app.js
          grep -q 'TMY_VOICE_V23' tesla-waze-preview/app.js
          grep -q 'NAV_LOCAL_CORRIDOR_V58' tesla-waze-preview/app.js
          grep -q 'NAV_WRONG_TURN_REROUTE_V64' tesla-waze-preview/app.js
          grep -q 'MUSIC_DISPLAY_LATIN_FILTER_V56' tesla-waze-preview/app.js
          ! grep -q 'learnedLocal:true' tesla-waze-preview/app.js
      - name: Rebuild JS asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, base64
          p=Path('tesla-waze-preview/app.js')
          data=gzip.compress(p.read_bytes(),compresslevel=9)
          Path('tesla-waze-preview/app.js.gz.b64').write_text(base64.b64encode(data).decode('ascii'))
          PY
      - name: Commit V67
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'nav: restore TM-Y core and voice scheduling'
          git push origin HEAD:tesla-waze-preview-v1
