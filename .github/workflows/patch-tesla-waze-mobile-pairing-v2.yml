name: Run Tesla Waze mobile pairing patcher
on:
  push:
    branches:
      - debug/tesla-waze-bundle-1-9
    paths:
      - .github/workflows/patch-tesla-waze-mobile-pairing-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare live branch
        run: |
          cp tools/patch_tesla_waze_mobile_pairing.py /tmp/patch_tesla_waze_mobile_pairing.py
          git fetch origin tesla-waze-preview-v1
          git checkout -B live origin/tesla-waze-preview-v1
      - name: Apply pairing patch
        run: python /tmp/patch_tesla_waze_mobile_pairing.py
      - name: Syntax check
        run: node --check tesla-waze-preview/app.js
      - name: Commit live pairing
        run: |
          git config user.name lukaslejko-jpg
          git config user.email lukaslejko@gmail.com
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git commit -m "Restore working mobile pairing"
          git push origin HEAD:tesla-waze-preview-v1
