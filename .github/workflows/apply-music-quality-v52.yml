name: Apply Smart Music quality filter V52

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - 'tesla-waze-preview/music-quality-filter-patch.py'
      - '.github/workflows/apply-music-quality-v52.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0
      - name: Apply music quality filter
        run: python3 tesla-waze-preview/music-quality-filter-patch.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'MUSIC_QUALITY_FILTER_V52' tesla-waze-preview/app.js
          grep -q 'MUSIC_MIN_SECONDS=60' tesla-waze-preview/app.js
          grep -q 'filter(isEligibleMusic)' tesla-waze-preview/app.js
      - name: Rebuild assets
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          for f in app.js app.css; do
            gzip -n -c "$f" > "$f.gz"
            gzip -t "$f.gz"
            base64 -w 0 "$f.gz" > "$f.gz.b64"
            base64 -d "$f.gz.b64" > verify.gz
            gzip -t verify.gz
            cmp <(gzip -dc verify.gz) "$f"
            rm -f "$f.gz" verify.gz
          done
      - name: Commit quality filter assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git commit -m 'music: filter non-song and short media'
          git push origin HEAD:tesla-waze-preview-v1
