name: Tesla Music docs cache V29
on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/mobile-docs-cache-v29.yml'
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
          fetch-depth: 0
      - name: Update canonical docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md')
          s=p.read_text()
          note='''\n\n## V29 – AirPlay a permanentný cache bust\n\nProdukčný root, Service Worker a asset loadery používajú verziu V29. Service Worker cache je `tesla-music-pwa-v29`; CORE používa assety s `&v=29` a root registruje `/sw.js?v=29`. `account-v8.js` načítava `/api/asset?name=offline-v20.js&v=29`. Tým sa zabraňuje tomu, aby iPhone po nasadení novej mobilnej funkcie ostal na starej V23/V24 cache.\n\nOffline modul V29 pridáva tlačidlo `◉ AirPlay` do hornej lišty mobilnej Tesla Music. Pri lokálnom/offline audiu používa systémový iOS AirPlay picker, ak ho WebKit sprístupní. Funkcia nevyžaduje YouTube konto a nemení Tesla Waze navigáciu.\n'''
          if '## V29 – AirPlay a permanentný cache bust' not in s:
              s += note
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TESLA_MUSIC_MOBILE_SINGLE_SOURCE_OF_TRUTH.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(tesla-music): record V29 cache bust'
          git push origin HEAD:tesla-music-v6-preview
