name: Music mobile cleanup V105
on:
  push:
    branches: [tesla-waze-v105-work]
    paths: ['.github/workflows/music-mobile-clean-v105.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v105-work
          fetch-depth: 0
      - name: Remove duplicate mobile search helper
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('tesla-waze-preview/app.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'function ensureMobileMaxSearch\(\)\{.*?\}/\* MUSIC_MOBILE_SEARCH_V103 \*/\n','',s,count=1,flags=re.S)
          assert n==1, f'helper removal mismatch {n}'
          old="if(isMax){ensureMaxMusicHeaderSearch();ensureMobileMaxSearch();renderMusicMaxHome()}else{removeMaxMusicHeaderSearch();ensureMobileMaxSearch()}"
          new="if(isMax){ensureMaxMusicHeaderSearch();renderMusicMaxHome()}else removeMaxMusicHeaderSearch()"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Replace mobile overrides
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('tesla-waze-preview/mobile-v102.css')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n/\* MUSIC_MOBILE_SEARCH_V103 \*/.*?(?=\n/\* MUSIC_MOBILE_STACK_AND_VIDEO_V104 \*/)','',s,count=1,flags=re.S)
          s=re.sub(r'\n/\* MUSIC_MOBILE_STACK_AND_VIDEO_V104 \*/.*?\Z','',s,count=1,flags=re.S)
          s += r'''

/* MUSIC_MOBILE_CLEAN_V105 */
@media(max-width:900px){
  html body .music-shell.music-maximized .music-head{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important;padding:8px 10px 10px!important;position:relative!important;z-index:7020!important;background:#0f1720!important;overflow:visible!important}
  html body .music-shell.music-maximized #musicHeaderSearch{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:6px!important;width:100%!important;min-width:0!important;margin:0!important;order:1!important;position:static!important;z-index:auto!important}
  html body .music-shell.music-maximized .music-head-actions{order:2!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;width:100%!important;position:static!important;z-index:auto!important}
  html body .music-shell.music-maximized .music-head-actions .btn{width:100%!important;min-width:0!important;max-width:none!important;min-height:44px!important;height:44px!important;padding:0 7px!important;font-size:12px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
  html body .music-shell.music-maximized #musicMobileMaxSearch{display:none!important}
  html body .music-shell.music-maximized .music-player{position:relative!important;z-index:1!important;padding:10px!important}
  html body .music-shell.music-maximized .music-player .yt-player{display:none!important;position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;inset:auto!important;transform:none!important;width:100%!important;max-width:100%!important;max-height:none!important;margin:8px 0!important}
  html body .music-shell.music-maximized.music-video-open .music-player .yt-player{display:block!important;position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;inset:auto!important;transform:none!important;width:100%!important;max-width:100%!important;max-height:36dvh!important;margin:8px 0!important}
}
'''
          p.write_text(s,encoding='utf-8')
      - name: Cache bust mobile stylesheet
        shell: python
        run: |
          from pathlib import Path
          p=Path('tesla-waze-preview/live3.html')
          s=p.read_text(encoding='utf-8')
          assert './mobile-v102.css?v=104' in s
          p.write_text(s.replace('./mobile-v102.css?v=104','./mobile-v102.css?v=105',1),encoding='utf-8')
      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          ! grep -q 'function ensureMobileMaxSearch' tesla-waze-preview/app.js
          grep -q 'MUSIC_MOBILE_CLEAN_V105' tesla-waze-preview/mobile-v102.css
          grep -q 'mobile-v102.css?v=105' tesla-waze-preview/live3.html
          gzip -n -9 -c tesla-waze-preview/app.js | base64 -w0 > tesla-waze-preview/app.js.gz.b64
          base64 -d tesla-waze-preview/app.js.gz.b64 | gzip -dc | cmp - tesla-waze-preview/app.js
      - name: Commit V105
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/mobile-v102.css tesla-waze-preview/live3.html
          git commit -m 'music: remove duplicate mobile search and keep controls above video V105 [skip ci]'
          git push origin HEAD:tesla-waze-v105-work
