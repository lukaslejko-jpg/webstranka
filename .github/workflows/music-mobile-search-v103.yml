name: Music mobile search V103
on:
  push:
    branches: [tesla-waze-v103-work]
    paths:
      - '.github/workflows/music-mobile-search-v103.yml'
      - 'tesla-waze-preview/v103_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v103-work
          fetch-depth: 0
      - name: Apply V103 patch
        run: python3 tesla-waze-preview/v103_patch.py
      - name: Verify and rebuild runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'MUSIC_MOBILE_SEARCH_V103' tesla-waze-preview/app.js
          grep -q 'MUSIC_MOBILE_SEARCH_V103' tesla-waze-preview/mobile-v102.css
          gzip -n -9 -c tesla-waze-preview/app.js | base64 -w0 > tesla-waze-preview/app.js.gz.b64
          base64 -d tesla-waze-preview/app.js.gz.b64 | gzip -dc | cmp - tesla-waze-preview/app.js
      - name: Commit V103 runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/mobile-v102.css
          git commit -m 'music: add persistent mobile max search V103 [skip ci]'
          git push origin HEAD:tesla-waze-v103-work
