name: Check Tesla Waze Supabase backends
on:
  push:
    branches:
      - debug/tesla-waze-bundle-1-9
    paths:
      - .github/workflows/check-tesla-waze-supabase-backends.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Google secret presence
        run: |
          curl --fail --silent --show-error 'https://dimvegkezslqjtsxdohp.supabase.co/functions/v1/twsecretscheck'
      - name: Check repaired charger service around Presov
        run: |
          set -o pipefail
          curl --fail --max-time 35 --silent --show-error 'https://dimvegkezslqjtsxdohp.supabase.co/functions/v1/twchargers?left=21.10&right=21.40&bottom=48.90&top=49.10' | tee /tmp/chargers.json | head -c 1200
          python - <<'PY'
          import json
          d=json.load(open('/tmp/chargers.json'))
          assert isinstance(d.get('stations'),list)
          assert d.get('degraded') is not True, d
          assert len(d['stations'])>0, d
          print('\nchargers_count=',len(d['stations']))
          PY
      - name: Check repaired traffic service around Presov
        run: |
          set -o pipefail
          curl --fail --max-time 15 --silent --show-error 'https://dimvegkezslqjtsxdohp.supabase.co/functions/v1/twtraffic?left=21.10&right=21.40&bottom=48.90&top=49.10' | tee /tmp/traffic.json | head -c 1200
          python - <<'PY'
          import json
          d=json.load(open('/tmp/traffic.json'))
          assert isinstance(d.get('alerts'),list)
          assert isinstance(d.get('jams'),list)
          print('\ntraffic_source=',d.get('source'),'degraded=',d.get('degraded'),'alerts=',len(d['alerts']),'jams=',len(d['jams']))
          PY
