name: Apply Tesla Music Offline V25 identity fix

on:
  push:
    branches: [tesla-music-v6-preview]
    paths:
      - '.github/workflows/apply-offline-v25-identity-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-music-v6-preview
          fetch-depth: 0
      - name: Patch offline resolver only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tesla-music-v7-preview/offline-v20.js')
          s=p.read_text()
          old="function candidateScore(qt,qa,t,a){const ts=sim(qt,t),as=qa?sim(qa,a):1;if(ts<.66)return 0;if(qa&&as<.25)return 0;return ts*.78+as*.22}"
          new="""function stripArtistWords(title,artist){let words=fold(title).split(/\\s+/).filter(Boolean);const aw=new Set(fold(artist).split(/\\s+/).filter(x=>x.length>2));return words.filter(x=>!aw.has(x)).join(' ')}
function candidateScore(qt,qa,t,a){const ts=Math.max(sim(qt,t),qa?sim(qt,stripArtistWords(t,qa)):0),as=qa?sim(qa,a):1;if(ts<.66)return 0;if(qa&&as<.25)return 0;return ts*.78+as*.22}
function genericUploader(a){return /^(audio library|youtube|music library|royalty free music|no copyright(?: sounds?)?|nocopyrightsounds?|ncs)$/i.test(clean(a))}
function stripPromo(s){return clean(String(s||'').replace(/\\s*[\\[(][^\\])]*(?:no copyright|copyright free|royalty free)[^\\])]*[\\])]\\s*/ig,' '))}
function identityCandidates(title,artist){const t=stripPromo(title),a=clean(artist),out=[];const push=(title,artist)=>{title=stripPromo(title);artist=clean(artist);const k=fold(title)+'|'+fold(artist);if(title&&!out.some(x=>x.k===k))out.push({title,artist,k})};if(!genericUploader(a)){push(t,a);return out}push(t,'');const parts=t.split(/\\s+[–—-]\\s+/).map(x=>x.trim()).filter(Boolean);if(parts.length>=2){const left=parts[0],right=parts.slice(1).join(' - ');push(left,right);push(right,left)}return out}"""
          if old not in s:
              raise SystemExit('candidateScore anchor not found')
          s=s.replace(old,new,1)
          old2="try{const candidates=await resolveCandidates(t.title||'',t.uploader||t.artist||'');if(!candidates.length)throw new Error('not_found');let last=null;"
          new2="try{let candidates=[];for(const ident of identityCandidates(t.title||'',t.uploader||t.artist||'')){candidates=await resolveCandidates(ident.title,ident.artist);if(candidates.length)break}if(!candidates.length)throw new Error('not_found');let last=null;"
          if old2 not in s:
              raise SystemExit('saveOffline anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Verify narrow change
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-music-v7-preview/offline-v20.js
          grep -q 'identityCandidates' tesla-music-v7-preview/offline-v20.js
          grep -q 'stripArtistWords' tesla-music-v7-preview/offline-v20.js
          grep -q "qs.get('map')==='1'||qs.get('embed')==='1'" tesla-music-v7-preview/offline-v20.js
          ! grep -q 'twmusic-offline-queue' tesla-music-v7-preview/offline-v20.js
      - name: Commit patched resolver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-music-v7-preview/offline-v20.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(tesla-music): normalize offline identity matching'
          git push origin HEAD:tesla-music-v6-preview
