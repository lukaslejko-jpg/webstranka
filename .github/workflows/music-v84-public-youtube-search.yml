name: Smart Music V84 public YouTube search
on:
  push:
    branches: [tesla-waze-v84-work]
    paths:
      - 'tesla-waze-preview/music-v84-public-youtube-search-patch.py'
      - '.github/workflows/music-v84-public-youtube-search.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tesla-waze-v84-work
      - name: Apply V84 patch
        run: python tesla-waze-preview/music-v84-public-youtube-search-patch.py
      - name: Syntax check
        run: node --check tesla-waze-preview/app.js
      - name: Verify V84 invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tesla-waze-preview/app.js').read_text()
          assert s.count('MUSIC_PUBLIC_YOUTUBE_SEARCH_V84')==1
          assert "functions/v1/twyoutubesearch?q=" in s
          assert "async function searchYoutube(q)" in s
          assert "'/api/music/youtube/likes'" in s
          PY
      - name: Rebuild JS runtime payload
        run: |
          python - <<'PY'
          import gzip,base64,pathlib
          p=pathlib.Path('tesla-waze-preview/app.js')
          raw=p.read_bytes()
          out=base64.b64encode(gzip.compress(raw,mtime=0)).decode()
          pathlib.Path('tesla-waze-preview/app.js.gz.b64').write_text(out,encoding='ascii')
          assert gzip.decompress(base64.b64decode(out))==raw
          PY
      - name: Commit V84
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.js.gz.b64
          git commit -m 'music: public YouTube search V84'
          git push origin HEAD:tesla-waze-v84-work
