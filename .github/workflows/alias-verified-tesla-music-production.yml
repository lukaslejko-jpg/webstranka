name: Alias verified Tesla Music production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alias-verified-tesla-music-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEAM_SLUG: lukaslejko-9932s-projects
      VERIFIED_DPL_URL: https://tesla-waze-piped-h6gkc3w2l-lukaslejko-9932s-projects.vercel.app
      PROD_ALIAS: tesla-waze-piped.vercel.app
      EXPECTED_BUILD: "158"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@59.25.4

      - name: Authenticate Vercel CLI
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG=/tmp/vercel-device-auth.log
          rm -f "$LOG"
          timeout 300 vercel login --github >"$LOG" 2>&1 &
          PID=$!
          CODE=""
          URL=""
          for _ in $(seq 1 60); do
            if grep -Eq 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" 2>/dev/null; then
              URL="$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' "$LOG" | tail -n1)"
              CODE="${URL##*user_code=}"
              break
            fi
            sleep 1
          done
          test -n "$CODE"
          echo "::notice title=Vercel device code::$CODE"
          node - "$CODE" "$URL" <<'NODE' >/tmp/status.json
          const [code,url]=process.argv.slice(2);
          process.stdout.write(JSON.stringify({state:'pending',context:'tesla-music-production-auth',description:'Vercel code: '+code,target_url:url}));
          NODE
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json >/dev/null
          cat "$LOG"
          wait "$PID"

      - name: Verify identity
        run: vercel whoami

      - name: Verify exact tested deployment before alias
        run: |
          set -euo pipefail
          vercel inspect "$VERIFIED_DPL_URL" --scope "$TEAM_SLUG"
          vercel curl "/?mobile=1&device=mobile" --deployment "$VERIFIED_DPL_URL" --scope "$TEAM_SLUG" > /tmp/tested-root.html
          grep -Fq "tesla-music-build\" content=\"$EXPECTED_BUILD" /tmp/tested-root.html
          ! grep -q "mobile-controls-v40.js" /tmp/tested-root.html
          echo "EXACT_TESTED_DEPLOYMENT_OK"

      - name: Point production alias to exact tested deployment
        run: |
          set -euo pipefail
          vercel alias set "$VERIFIED_DPL_URL" "$PROD_ALIAS" --scope "$TEAM_SLUG"
          echo "ALIAS_SET_OK"

      - name: Verify production is exact tested build
        run: |
          set -euo pipefail
          sleep 3
          vercel inspect "https://$PROD_ALIAS" --scope "$TEAM_SLUG"
          vercel curl "/?mobile=1&device=mobile" --deployment "https://$PROD_ALIAS" --scope "$TEAM_SLUG" > /tmp/prod-root.html
          cmp -s /tmp/tested-root.html /tmp/prod-root.html
          grep -Fq "tesla-music-build\" content=\"$EXPECTED_BUILD" /tmp/prod-root.html
          ! grep -q "mobile-controls-v40.js" /tmp/prod-root.html
          echo "PRODUCTION_ALIAS_EXACT_TESTED_BUILD_OK"
