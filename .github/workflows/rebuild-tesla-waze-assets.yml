name: Rebuild Tesla Waze assets

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - 'tesla-waze-preview/app.js'
      - 'tesla-waze-preview/app.css'
      - 'tesla-waze-preview/music-mini-patch.py'
      - '.github/workflows/rebuild-tesla-waze-assets.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0

      - name: Apply tm-y navigation viewport once
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tesla-waze-preview/app.js')
          s = path.read_text(encoding='utf-8')
          marker = '/* TMY_VIEWPORT_V1 */'
          if marker in s:
              print('tm-y viewport already applied')
              raise SystemExit(0)
          raise SystemExit('TMY viewport marker missing unexpectedly')
          PY

      - name: Apply Smart Music minimized UI once
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-mini-patch.py

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'TMY_VIEWPORT_V1' tesla-waze-preview/app.js
          grep -q 'MUSIC_MINI_QUEUE_V1' tesla-waze-preview/app.js
          grep -q 'MUSIC_MINI_QUEUE_V2' tesla-waze-preview/app.js
          grep -q 'music-mini-seekrow' tesla-waze-preview/app.css
          grep -q 'minimized:musicWindowState().minimized' tesla-waze-preview/app.js

      - name: Build and verify JS and CSS gzip/base64
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          for f in app.js app.css; do
            gzip -n -c "$f" > "$f.gz"
            gzip -t "$f.gz"
            base64 -w 0 "$f.gz" > "$f.gz.b64"
            test -s "$f.gz.b64"
            base64 -d "$f.gz.b64" > verify.gz
            gzip -t verify.gz
            cmp <(gzip -dc verify.gz) "$f"
            rm -f "$f.gz" verify.gz
          done

      - name: Commit source and rebuilt assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          if git diff --cached --quiet; then echo 'Source and assets already correct.'; exit 0; fi
          git commit -m 'music: V2 mini queue before first play'
          git push origin HEAD:tesla-waze-preview-v1
