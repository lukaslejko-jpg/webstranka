name: Rebuild Tesla Waze assets

on:
  push:
    branches:
      - tesla-waze-preview-v1
    paths:
      - 'tesla-waze-preview/app.js'
      - 'tesla-waze-preview/app.css'
      - 'tesla-waze-preview/music-mini-patch.py'
      - 'tesla-waze-preview/music-free-fallback-patch.py'
      - 'tesla-waze-preview/music-gapless-handoff-patch.py'
      - 'tesla-waze-preview/music-audio-keepalive-patch.py'
      - 'tesla-waze-preview/music-transition-keepalive-patch.py'
      - 'tesla-waze-preview/music-continuous-session-patch.py'
      - 'tesla-waze-preview/music-tesla-media-controls-patch.py'
      - 'tesla-waze-preview/music-exclusive-focus-patch.py'
      - 'tesla-waze-preview/music-dual-player-handoff-patch.py'
      - 'tesla-waze-preview/music-stabilize-fullqueue-patch.py'
      - 'tesla-waze-preview/music-next-unlock-patch.py'
      - 'tesla-waze-preview/music-restore-prekeepalive-core.py'
      - 'tesla-waze-preview/music-session-hold-patch.py'
      - 'tesla-waze-preview/music-persistent-youtube-player-patch.py'
      - 'tesla-waze-preview/music-disable-mediasession-patch.py'
      - 'tesla-waze-preview/navigation-tmy-full-behavior-patch.py'
      - 'tesla-waze-preview/navigation-tmy-voice-patch.py'
      - 'tesla-waze-preview/navigation-voice-volume-patch.py'
      - 'tesla-waze-preview/mobile-ui-patch.py'
      - 'tesla-waze-preview/mobile-route-fix-patch.py'
      - 'tesla-waze-preview/mobile-native-gps-patch.py'
      - '.github/workflows/rebuild-tesla-waze-assets.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tesla-waze-preview-v1
          fetch-depth: 0

      - name: Verify tm-y navigation base
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TMY_VIEWPORT_V1' tesla-waze-preview/app.js
          grep -q 'TMY_EXACT_NAV_V21' tesla-waze-preview/app.js

      - name: Enforce full tm-y navigation behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/navigation-tmy-full-behavior-patch.py

      - name: Mirror tm-y navigation voice logic
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/navigation-tmy-voice-patch.py

      - name: Add independent navigation voice volume
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/navigation-voice-volume-patch.py

      - name: Apply Smart Music layout patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-mini-patch.py

      - name: Apply free YouTube fallback and expanded queue
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-free-fallback-patch.py

      - name: Apply seamless YouTube track handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-gapless-handoff-patch.py

      - name: Keep browser audio session alive between tracks
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-audio-keepalive-patch.py

      - name: Use transition-only keepalive and restore Smart Music media focus
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-transition-keepalive-patch.py

      - name: Preserve live player across map/music UI toggles
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-continuous-session-patch.py

      - name: Restore Tesla system media controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-tesla-media-controls-patch.py

      - name: Enforce exclusive Tesla music focus
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-exclusive-focus-patch.py

      - name: Use dual YouTube players for zero-gap handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-dual-player-handoff-patch.py

      - name: Stabilize music controls and full queue
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-stabilize-fullqueue-patch.py

      - name: Restore pre-gapless Smart Music core
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-next-unlock-patch.py

      - name: Hold Tesla media session across track transitions
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-session-hold-patch.py

      - name: Keep one YouTube player across track changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-persistent-youtube-player-patch.py

      - name: Restore pre-MediaSession Tesla audio behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/music-disable-mediasession-patch.py

      - name: Apply mobile-only layout
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/mobile-ui-patch.py

      - name: Apply mobile pending-route fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/mobile-route-fix-patch.py

      - name: Restore native Safari geolocation outside Tesla iframe
        shell: bash
        run: |
          set -euo pipefail
          python3 tesla-waze-preview/mobile-native-gps-patch.py

      - name: Syntax and marker checks
        shell: bash
        run: |
          set -euo pipefail
          node --check tesla-waze-preview/app.js
          grep -q 'TMY_VIEWPORT_V1' tesla-waze-preview/app.js
          grep -q 'TMY_EXACT_NAV_V21' tesla-waze-preview/app.js
          grep -q 'TMY_FULL_NAV_V22' tesla-waze-preview/app.js
          grep -q 'TMY_VOICE_V23' tesla-waze-preview/app.js
          grep -q 'NAV_VOICE_VOLUME_V25' tesla-waze-preview/app.js
          grep -q 'MUSIC_CONTINUOUS_SESSION_V24' tesla-waze-preview/app.js
          grep -q 'MUSIC_TESLA_MEDIA_CONTROLS_V26' tesla-waze-preview/app.js
          grep -q 'MUSIC_EXCLUSIVE_FOCUS_V27' tesla-waze-preview/app.js
          grep -q 'MUSIC_TRANSITION_BRIDGE_V31' tesla-waze-preview/app.js
          grep -q 'MUSIC_DUAL_PLAYER_HANDOFF_V33' tesla-waze-preview/app.js
          grep -q 'MUSIC_MANUAL_NEXT_ZERO_GAP_V34' tesla-waze-preview/app.js
          grep -q 'MUSIC_STABLE_CONTROLS_FULL_QUEUE_V35' tesla-waze-preview/app.js
          grep -q 'MUSIC_LIKE_TOGGLE_V36' tesla-waze-preview/app.js
          grep -q 'MUSIC_SHUFFLE_NAV_FIX_V37' tesla-waze-preview/app.js
          grep -q 'MUSIC_NEXT_UNLOCK_V38' tesla-waze-preview/app.js
          grep -q 'MUSIC_MANUAL_DIRECT_NAV_V39' tesla-waze-preview/app.js
          grep -q 'MUSIC_SINGLE_PLAYER_STABLE_NAV_V40' tesla-waze-preview/app.js
          grep -q 'MUSIC_PREKEEPALIVE_CORE_V41' tesla-waze-preview/app.js
          grep -q 'MUSIC_PREGAPLESS_CORE_V42' tesla-waze-preview/app.js
          grep -q 'MUSIC_SESSION_HOLD_V43' tesla-waze-preview/app.js
          grep -q 'MUSIC_PERSISTENT_YT_V44' tesla-waze-preview/app.js
          grep -q 'MUSIC_DISABLE_MEDIASESSION_V45' tesla-waze-preview/app.js
          grep -q 'loadVideoById({videoId:yt,startSeconds:0})' tesla-waze-preview/app.js
          grep -q 'NAV_VOICE_CANCEL_V10' tesla-waze-preview/app.js
          grep -q 'NAV_SAFE_ICONS_V13' tesla-waze-preview/app.js
          grep -q 'MUSIC_MINI_RESIZE_V4' tesla-waze-preview/app.js
          grep -q 'MUSIC_LAYOUT_NO_RESTART_V5' tesla-waze-preview/app.js
          grep -q 'MUSIC_FREE_FALLBACK_V15' tesla-waze-preview/app.js
          grep -q 'MUSIC_GAPLESS_HANDOFF_V16' tesla-waze-preview/app.js
          grep -q 'MUSIC_AUDIO_KEEPALIVE_V17' tesla-waze-preview/app.js
          grep -q 'MUSIC_TRANSITION_KEEPALIVE_V18' tesla-waze-preview/app.js
          grep -q 'MOBILE_PENDING_ROUTE_V11' tesla-waze-preview/app.js
          grep -q 'MOBILE_NATIVE_GPS_V12' tesla-waze-preview/app.js
          grep -q 'MOBILE_UI_V1' tesla-waze-preview/app.css
          grep -q 'MUSIC_FULL_QUEUE_V15' tesla-waze-preview/app.css
          ! grep -q 'return a.slice(0,40)' tesla-waze-preview/app.js
          ! grep -q 'q.slice(0,40).map' tesla-waze-preview/app.js
          ! grep -q 'left<=5.0&&n&&!music.ytStandby' tesla-waze-preview/app.js
          ! grep -q 'ENDED){music.wantsPlayback=false;setMusicPlaying(false)' tesla-waze-preview/app.js
          ! grep -q 'navigator.mediaSession.metadata=' tesla-waze-preview/app.js
          ! grep -q 'navigator.mediaSession.playbackState=' tesla-waze-preview/app.js
          ! grep -q 'navigator.mediaSession.setActionHandler(' tesla-waze-preview/app.js
          ! grep -q 'navigator.mediaSession.setPositionState(' tesla-waze-preview/app.js

      - name: Build and verify JS and CSS gzip/base64
        shell: bash
        run: |
          set -euo pipefail
          cd tesla-waze-preview
          for f in app.js app.css; do
            gzip -n -c "$f" > "$f.gz"
            gzip -t "$f.gz"
            base64 -w 0 "$f.gz" > "$f.gz.b64"
            test -s "$f.gz.b64"
            base64 -d "$f.gz.b64" > verify.gz
            gzip -t verify.gz
            cmp <(gzip -dc verify.gz) "$f"
            rm -f "$f.gz" verify.gz
          done

      - name: Commit source and rebuilt assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tesla-waze-preview/app.js tesla-waze-preview/app.css tesla-waze-preview/app.js.gz.b64 tesla-waze-preview/app.css.gz.b64
          if git diff --cached --quiet; then echo 'Source and assets already correct.'; exit 0; fi
          git commit -m 'music: restore pre-MediaSession Tesla audio behavior'
          git push origin HEAD:tesla-waze-preview-v1
