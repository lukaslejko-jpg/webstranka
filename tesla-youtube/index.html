<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music for Tesla</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.top{height:76px;display:flex;align-items:center;gap:18px;padding:12px 24px;border-bottom:1px solid #2a2a2a}.logo{font-size:27px;font-weight:800}.search{flex:1;max-width:760px;background:#202020;border:1px solid #444;border-radius:26px;color:#fff;padding:13px 20px;font-size:19px;-webkit-user-select:text;user-select:text;pointer-events:auto;touch-action:manipulation}.go{border:0;border-radius:24px;padding:13px 24px;font-size:17px;font-weight:800}.main{height:calc(100vh - 76px);display:grid;grid-template-columns:minmax(0,1.55fr) minmax(380px,.85fr)}.browse{overflow:auto;padding:22px}.title{font-size:24px;font-weight:800;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{cursor:pointer}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#222}.ct{font-size:16px;font-weight:800;margin-top:8px;line-height:1.25}.ca{color:#aaa;font-size:13px;margin-top:4px}.player{border-left:1px solid #2a2a2a;background:#151515;padding:18px;display:flex;flex-direction:column;min-width:0}.video{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}.video iframe{width:100%;height:100%}.now{font-size:20px;font-weight:800;margin-top:15px}.artist{color:#aaa;margin-top:5px}.seek{width:100%;margin:18px 0}.controls{display:flex;justify-content:center;align-items:center;gap:14px}.ctl{width:58px;height:58px;border:1px solid #555;border-radius:50%;font-size:0;font-weight:800;background:#202020;color:#fff;display:flex;align-items:center;justify-content:center}.ctl::before{font-size:25px;line-height:1}.play{width:66px;height:66px}.play::before{content:'▶'}.ctl#prev::before{content:'⏮'}.ctl#next::before{content:'⏭'}.ctl#shuffle::before{content:'↝';font-size:28px}.active{outline:3px solid #fff}.status{color:#aaa;margin-top:14px;text-align:center}.queue{margin-top:18px;overflow:auto;border-top:1px solid #333;padding-top:12px}.qi{padding:9px;border-radius:9px;font-size:14px}.qi.on{background:#292929;font-weight:800}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{grid-template-columns:minmax(0,1.35fr) minmax(350px,.85fr)}}</style></head><body>

<div class="main"><section class="browse"><h2 id="heading" class="title">YouTube</h2><div id="grid" class="grid"></div></section><aside class="player"><div class="video"><div id="yt"></div></div><div id="now" class="now">Vyber skladbu</div><div id="artist" class="artist">YouTube</div><input id="seek" class="seek" type="range" min="0" max="1000" value="0"><div class="controls"><button id="prev" class="ctl" aria-label="Predchádzajúca"></button><button id="play" class="ctl play" aria-label="Prehrať"></button><button id="next" class="ctl" aria-label="Ďalšia"></button><button id="shuffle" class="ctl" aria-label="Náhodne"></button></div><div id="status" class="status">Pripravené</div><div id="queue" class="queue"></div></aside></div>
<script src="https://www.youtube.com/iframe_api"></script><script src="/tesla-app.js?v=1"></script></body></html>
